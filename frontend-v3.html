<!doctype html>
<!-- VTG frontend v3: map controller updated to map-enhancer-v2.js -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vintage Trade Global — a connected marketplace for buyers, suppliers, financial institutions and cross-border trade.">
<meta name="theme-color" content="#08283d">
<title>Vintage Trade Global — Global Trade, Sourcing & Finance</title>
</head>
<body>
<script>
(function(){
  function loadMapEnhancer(){
    if(window.VTGInitMap)return window.VTGInitMap();
    if(document.querySelector('script[data-vtg-map-enhancer-v2]'))return;
    var s=document.createElement('script');
    s.src='/map-enhancer-v2.js?v=1.0.0';
    s.dataset.vtgMapEnhancerV2='1';
    s.onload=function(){if(window.VTGInitMap)window.VTGInitMap()};
    s.onerror=function(){var e=document.getElementById('mapDrawer');if(e)e.setAttribute('data-map-error','Trade Atlas controller failed to load')};
    document.head.appendChild(s);
  }
  window.VTGLoadMapEnhancer=loadMapEnhancer;
  document.addEventListener('click',function(e){var b=e.target.closest('#mapBtn,[data-open-map],#footMap');if(b){setTimeout(loadMapEnhancer,0)}});
})();
</script>
</body>
</html>
