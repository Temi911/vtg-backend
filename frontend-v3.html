<!doctype html>
<html lang="en">

<meta name="theme-color" content="#08283d">

<style>
:root{--navy:#123b57;--deep:#071f30;--teal:#0e969f;--cyan:#39c5cf;--gold:#d6a23a;--cream:#f5f8f8;--white:#fff;--ink:#102a3c;--muted:#607586;--line:#dbe5e9;--soft:#eaf4f6;--shadow:0 18px 55px rgba(7,31,48,.13);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}.lucide{width:18px;height:18px;stroke-width:1.8}.topline{height:4px;background:linear-gradient(90deg,var(--gold),#f0ca76,var(--teal),var(--navy))}
.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.navin{max-width:1260px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:11px;min-width:250px}.brandLogo{width:44px;height:44px;object-fit:cover;object-position:left center;border-radius:7px;background:#fff}.brandFallback{width:44px;height:44px;border-radius:10px;background:linear-gradient(145deg,var(--navy),var(--teal));color:#fff;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;font-size:23px}.brandText{font-weight:800;color:var(--navy);font-size:14px;line-height:1.1}.brandText small{display:block;margin-top:4px;color:var(--muted);font-size:8px;letter-spacing:.13em;text-transform:uppercase}.navlinks{display:flex;gap:20px;margin-left:auto}.navlinks a{font-size:11px;color:#456173}.navtools{display:flex;gap:7px}.iconBtn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:11px;color:var(--navy);display:grid;place-items:center;position:relative}.iconBtn:hover{border-color:#b8cbd3;color:var(--teal)}.iconBtn .dot{position:absolute;right:7px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}.primary{border:0;background:var(--navy);color:#fff;border-radius:11px;padding:11px 17px;font-weight:700}.primary:hover{background:#0c2f47}.outline{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:11px;padding:11px 17px;font-weight:700}.outline:hover{border-color:#b9ccd4}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 75% 20%,rgba(57,197,207,.24),transparent 30%),linear-gradient(135deg,#e8f5f7,#fafcfb 58%,#edf3f4)}.hero:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(18,59,87,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,59,87,.045) 1px,transparent 1px);background-size:46px 46px}.heroIn{max-width:1260px;margin:auto;padding:70px 22px 55px;min-height:620px;display:grid;grid-template-columns:1.02fr .98fr;gap:45px;align-items:center;position:relative}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--teal);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.eyebrow:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--gold)}h1,h2,h3{font-family:Arial,Helvetica,sans-serif}.hero h1{font-size:clamp(44px,5.4vw,76px);line-height:1.01;letter-spacing:-.045em;color:var(--deep);margin:15px 0}.hero h1 span{color:var(--teal)}.hero p{max-width:650px;color:#536d7d;line-height:1.75;font-size:15px}.heroActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.heroStats{display:flex;gap:28px;flex-wrap:wrap;margin-top:30px}.stat strong{display:block;color:var(--navy);font-size:21px}.stat span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.visual{height:455px;position:relative}.tradeCard{position:absolute;background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:5px solid rgba(255,255,255,.75)}.tradeCard img{width:100%;height:100%;object-fit:cover}.tradeCard.main{width:70%;height:330px;right:9%;top:48px;transform:rotate(-2deg)}.tradeCard.side1{width:44%;height:230px;right:0;top:0;transform:rotate(5deg);opacity:.92}.tradeCard.side2{width:43%;height:225px;left:0;top:125px;transform:rotate(-7deg);opacity:.8}.tradeLabel{position:absolute;left:20px;right:20px;bottom:18px;background:rgba(7,31,48,.9);color:#fff;padding:12px 14px;border-radius:12px}.tradeLabel strong{display:block;font-size:13px}.tradeLabel span{font-size:9px;color:#b9ccd5}.newsPreview{position:absolute;right:18px;bottom:15px;width:315px;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:17px;padding:14px;z-index:5}.newsHead{display:flex;justify-content:space-between;align-items:center}.newsHead strong{font-size:12px}.newsHead button{border:0;background:none;color:var(--teal);font-size:9px;font-weight:800}.ticker{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);padding:7px 0;margin:8px 0;font-size:9px;color:#526d7e}.ticker span{display:inline-block;animation:tick 32s linear infinite}@keyframes tick{to{transform:translateX(-55%)}}.newsItem{display:grid;grid-template-columns:64px 1fr;gap:9px;padding:7px 0}.newsItem img{width:64px;height:45px;border-radius:8px;object-fit:cover}.newsItem b{font-size:9px;line-height:1.4;display:block}.newsItem small{font-size:7px;color:#7c8f99}
.section{max-width:1260px;margin:auto;padding:70px 22px}.sectionHead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:27px}.sectionHead h2{font-size:36px;color:var(--navy);margin:5px 0 0}.sectionHead p{max-width:540px;color:var(--muted);line-height:1.65;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:0 8px 28px rgba(9,38,58,.055);transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.ico{width:43px;height:43px;border-radius:13px;background:#eaf7f8;color:var(--teal);display:grid;place-items:center;margin-bottom:15px}.card h3{font-family:Arial,Helvetica,sans-serif;font-size:14px;margin:0 0 7px}.card p{font-size:10px;line-height:1.65;color:var(--muted);margin:0}
.roles{background:var(--deep);color:#fff}.roles .sectionHead h2{color:#fff}.roles .sectionHead p{color:#aebfc9}.rolegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.role{padding:25px;border:1px solid rgba(255,255,255,.12);border-radius:19px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025))}.role:hover{border-color:rgba(57,197,207,.65)}.role .rIcon{width:47px;height:47px;border-radius:14px;background:rgba(57,197,207,.1);color:var(--cyan);display:grid;place-items:center}.role h3{font-family:Arial,Helvetica,sans-serif;font-size:17px;margin:13px 0 7px}.role p{font-size:10px;line-height:1.65;color:#b7c8d1}.role button{margin-top:17px}
.market{background:#eef6f8}.marketGrid{display:grid;grid-template-columns:1.3fr .7fr;gap:17px}.productHero{min-height:320px;border-radius:20px;overflow:hidden;position:relative;background:var(--navy);color:#fff}.productHero img{width:100%;height:100%;object-fit:cover;opacity:.58}.productHero .copy{position:absolute;left:25px;right:25px;bottom:24px}.productHero h3{font-size:31px;margin:0 0 7px}.productHero p{font-size:10px;line-height:1.6;color:#e3edf1;max-width:620px}.miniGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.mini{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.mini img{width:100%;height:112px;object-fit:cover}.mini div{padding:11px}.mini b{font-size:10px}.mini small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.trust{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.trust span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:#5b7180;font-size:8px;font-weight:700}
.intel{background:#fff}.intelGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.intelCard{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#fff,#f4fafb);padding:22px}.intelCard h3{font-size:24px;color:var(--navy);margin:5px 0 8px}.intelCard p{font-size:10px;color:var(--muted);line-height:1.65}.intelList{display:grid;gap:8px;margin-top:17px}.intelRow{display:grid;grid-template-columns:36px 1fr auto;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:12px;background:#fff}.intelRow .iBox{width:32px;height:32px;border-radius:9px;background:var(--soft);color:var(--teal);display:grid;place-items:center}.intelRow b{font-size:9px}.intelRow small{display:block;font-size:7px;color:var(--muted);margin-top:2px}.intelRow em{font-size:7px;color:var(--teal);font-style:normal;font-weight:800}
.footer{background:#061a28;color:#b7c8d1}.footerIn{max-width:1260px;margin:auto;padding:42px 22px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px}.footer h4{color:#fff;margin:0 0 10px}.footer p,.footer a{font-size:9px;line-height:1.7;color:#8fa6b3}.footer a{display:block;margin:4px 0}.copyright{border-top:1px solid rgba(255,255,255,.08);padding:14px;text-align:center;font-size:8px;color:#708995}
.drawer{position:fixed;inset:0;z-index:1000;background:rgba(4,20,34,.64);backdrop-filter:blur(8px);display:none}.drawer.open{display:block}.drawerPanel{position:absolute;top:0;right:0;height:100%;width:min(560px,96vw);background:#f7fafb;box-shadow:-20px 0 70px rgba(0,0,0,.25);overflow:auto;padding:24px}.drawerTop{display:flex;justify-content:space-between;align-items:start}.drawerTop h2{font-size:29px;color:var(--navy);margin:4px 0 0}.close{border:1px solid var(--line);background:#fff;border-radius:50%;width:38px;height:38px;color:var(--navy);display:grid;place-items:center}.newsLarge{display:grid;gap:13px;margin-top:18px}.newsLarge article{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.newsLarge img{width:100%;height:150px;object-fit:cover}.newsLarge div{padding:14px}.newsLarge h3{font-family:Arial,Helvetica,sans-serif;font-size:14px;margin:0 0 5px}.newsLarge p{font-size:9px;color:var(--muted);line-height:1.55;margin:0}.newsSource{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:7px;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.rates{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.rate{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.rate b{font-size:11px}.rate small{display:block;color:var(--muted);font-size:7px;margin-top:3px}
#mapDrawer .drawerPanel{width:min(980px,98vw)}.mapSearch{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:14px}.mapSearch input{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.mapSearch button{border:0;border-radius:11px;background:var(--navy);color:#fff;padding:0 14px}.mapSearch .locate{background:var(--soft);color:var(--navy);border:1px solid var(--line)}#map{height:calc(100vh - 155px);min-height:480px;border-radius:15px;margin-top:16px;overflow:hidden}.mapNote{font-size:7px;color:var(--muted);margin-top:6px}
.aiLaunch{position:fixed;right:19px;bottom:19px;z-index:980;width:68px;height:68px;border-radius:20px;border:4px solid #fff;background:linear-gradient(145deg,#c8f1f4,#f4fcfd);box-shadow:0 12px 35px rgba(8,40,61,.25);display:grid;place-items:center}.botFace{width:47px;height:47px;border-radius:50%;background:linear-gradient(145deg,#092c43,#167a98);position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}.botFace:before,.botFace:after{content:'';position:absolute;top:18px;width:7px;height:7px;border-radius:50%;background:#8cf3ff;box-shadow:0 0 10px #8cf3ff}.botFace:before{left:12px}.botFace:after{right:12px}.botSmile{position:absolute;left:16px;right:16px;bottom:12px;height:7px;border-bottom:2px solid #8cf3ff;border-radius:0 0 15px 15px}
/* VTG global typography: use a sans-serif stack everywhere, including generated widgets. */
body,body *,button,input,select,textarea{font-family:Arial,Helvetica,sans-serif!important}
</style>
