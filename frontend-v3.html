const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let authRole='buyer',authMode='login',map,mapMarker;
function icons(){if(window.lucide)lucide.createIcons()}
(function(){const hero=document.getElementById('productHero');if(!hero)return;const imgs=hero.querySelectorAll('img');const badge=document.getElementById('productCatBadge');const labels=['Logistics & Ports','Cars & Vehicles','Agriculture','Pharmaceuticals','Construction Equipment','Heavy Vehicles & Trucks','Textiles & Clothing','Luxury Goods','Wristwatches'];let i=0;setInterval(function(){imgs[i].classList.remove('active');i=(i+1)%imgs.length;imgs[i].classList.add('active');if(badge){badge.style.opacity=0;setTimeout(function(){badge.textContent=labels[i];badge.style.opacity=1},400)}},4500)})();
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',icons,{once:true});else setTimeout(icons,0);
function loadMapLibre(){return new Promise((resolve,reject)=>{if(window.maplibregl)return resolve();const css='https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css';if(!document.querySelector('link[data-vtg-maplibre]')){const l=document.createElement('link');l.rel='stylesheet';l.href=css;l.dataset.vtgMaplibre='true';document.head.appendChild(l)}const s=document.createElement('script');s.src='https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js';s.async=true;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
function drawer(id,on=true){$('#'+id).classList.toggle('open',on);document.body.style.overflow=on?'hidden':'';if(on&&id==='mapDrawer')loadMapEnhancer()}
function loadMapEnhancer(){if(window.VTGInitMap)return window.VTGInitMap();if(document.querySelector('script[data-vtg-map-enhancer]'))return;const s=document.createElement('script');s.src='/map-enhancer.js?v=3';s.dataset.vtgMapEnhancer='1';s.onload=()=>window.VTGInitMap&&window.VTGInitMap();document.head.appendChild(s)}
$('#newsBtn').onclick=()=>drawer('newsDrawer');$('#newsOpen').onclick=()=>drawer('newsDrawer');$('#heroNews').onclick=()=>drawer('newsDrawer');$('#mapBtn').onclick=()=>drawer('mapDrawer');$$('[data-close]').forEach(b=>b.onclick=()=>drawer(b.dataset.close,false));$('#footNews').onclick=e=>{e.preventDefault();drawer('newsDrawer')};$('#footMap').onclick=e=>{e.preventDefault();drawer('mapDrawer')};
async function initMap(){if(map)return;try{await loadMapLibre();map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[8.6753,9.082],zoom:1.1,projection:{type:'globe'}});map.addControl(new maplibregl.NavigationControl(),'bottom-right');map.addControl(new maplibregl.FullscreenControl(),'bottom-right')}catch(e){console.warn('VTG map could not load',e);$('#map').innerHTML='<div style="height:100%;display:grid;place-items:center;padding:30px;text-align:center;color:#607586;background:#eef6f8;border-radius:15px">The world atlas is temporarily unavailable. Please try again shortly.</div>'}}
async function searchLocation(){const q=$('#mapSearch').value.trim();if(!q)return;if(!map)await initMap();if(!map)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});const d=await r.json();if(!d[0])return alert('Location not found. Try a city, country, port or company address.');const lon=+d[0].lon,lat=+d[0].lat;map.flyTo({center:[lon,lat],zoom:12,duration:1500});if(mapMarker)mapMarker.remove();mapMarker=new maplibregl.Marker({color:'#0e969f'}).setLngLat([lon,lat]).setPopup(new maplibregl.Popup().setHTML('<strong>'+d[0].display_name+'</strong>')).addTo(map);mapMarker.togglePopup()}catch{alert('Location search is temporarily unavailable.')}}
$('#mapSearchBtn').onclick=searchLocation;$('#mapSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchLocation()});$('#locateBtn').onclick=async()=>{if(!map)await initMap();if(!map)return;navigator.geolocation?.getCurrentPosition(p=>{map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:13,duration:1500});if(mapMarker)mapMarker.remove();mapMarker=new maplibregl.Marker({color:'#d6a23a'}).setLngLat([p.coords.longitude,p.coords.latitude]).setPopup(new maplibregl.Popup().setHTML('<strong>Your current location</strong>')).addTo(map);mapMarker.togglePopup()},()=>alert('Location permission was not granted.'));
function portal(){window.scrollTo(0,0);$('#landing').style.display='none';$('#portal').classList.add('active');icons()}function landing(){$('#portal').classList.remove('active');$('#landing').style.display='block';window.scrollTo(0,0)}$('#joinBtn').onclick=portal;$('#heroJoin').onclick=portal;$('#portalBack').onclick=landing;
function renderAuth(){const label={buyer:'Buyer / Importer',supplier:'Supplier / Trading Company',bank:'Bank / Financial Institution'}[authRole];$('#authTitle').textContent=(authMode==='login'?'Sign in — ':'Create account — ')+label;$('#authSubmit').textContent=authMode==='login'?'Sign in':'Create account';$('#switchAuth').textContent=authMode==='login'?'Create account instead':'Sign in instead';const s=$('#signupFields');s.innerHTML='';if(authMode==='signup'){s.innerHTML='<div class="formRow"><div><label>Full name *</label><input name="fullName" autocomplete="name" required></div><div><label>Phone number *</label><input name="phone" autocomplete="tel" required></div></div>'+(authRole==='supplier'?'<div><label>Company name *</label><input name="companyName" autocomplete="organization" required></div>':'')+(authRole==='bank'?'<div><label>Bank / institution name *</label><input name="bankName" autocomplete="organization" required></div>':'')+(authRole==='buyer'?'<div><label>Buyer type *</label><select name="buyerType" required><option value="">Select</option><option value="individual">Individual</option><option value="business">Business</option><option value="dealer">Dealer</option><option value="organisation">Organisation</option></select></div>':'')+'<div class="formRow"><div><label>Country *</label><input name="country" autocomplete="country-name" required value="Nigeria"></div><div><label>City *</label><input name="city" autocomplete="address-level2" required></div></div><div><label>Email verification code *</label><div class="verify"><input name="verificationCode" minlength="6" maxlength="6" required><button type="button" id="sendCode">Send code</button></div></div>'}icons();bindCode()}
function openAuth(role){authRole=role;authMode='login';renderAuth();$('#authModal').classList.add('open');document.body.style.overflow='hidden'}$$('[data-role]').forEach(b=>b.onclick=()=>openAuth(b.dataset.role));$('#authClose').onclick=()=>{$('#authModal').classList.remove('open');document.body.style.overflow=''};$('#switchAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';renderAuth()};
function bindCode(){const b=$('#sendCode');if(!b)return;b.onclick=async()=>{const email=$('input[name="email"]').value.trim();if(!email)return $('#authMsg').textContent='Enter your email first.';try{const r=await fetch('/api/auth/send-verification-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();$('#authMsg').textContent=r.ok?'Verification code sent. Check your email.':(d.message||'Could not send code')}catch{$('#authMsg').textContent='Could not send code right now'}}}
$('#authForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const msg=$('#authMsg');msg.textContent='';try{let endpoint='/api/auth/login',payload={email:data.email,password:data.password};if(authMode==='signup'){endpoint='/api/auth/signup/'+authRole;payload={email:data.email,password:data.password,fullName:data.fullName,phone:data.phone,verificationCode:data.verificationCode,preferredLanguage:'en',country:data.country,city:data.city};if(authRole==='buyer')payload.buyerType=data.buyerType;if(authRole==='supplier')payload.companyName=data.companyName;if(authRole==='bank')payload.bankName=data.bankName}const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.message||'Request failed');if(d.accessToken)localStorage.setItem('vtg_access_token',d.accessToken);msg.className='formMsg ok';msg.textContent=authMode==='login'?'Signed in successfully. Opening your VTG workspace…':'Account created successfully. Opening your VTG workspace…';setTimeout(()=>{const dest=authRole==='supplier'?'/supplier-dashboard.html':authRole==='bank'?'/bank-dashboard.html':'/buyer-dashboard.html';window.location.href=dest},500)}catch(err){msg.className='formMsg';msg.textContent=err.message}};
const aiPanel=$('#aiPanel'),aiMsgs=$('#aiMsgs'),aiInput=$('#aiInput');$('#aiLaunch').onclick=()=>{aiPanel.classList.add('open');aiInput.focus()};$('#aiClose').onclick=()=>aiPanel.classList.remove('open');$('#footAi').onclick=e=>{e.preventDefault();$('#aiLaunch').click()};function aiAdd(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'bot');d.textContent=text;aiMsgs.appendChild(d);aiMsgs.scrollTop=aiMsgs.scrollHeight}aiAdd('bot','Hello. I’m VTG AI. Tell me what you want to buy, sell, ship or finance, and I’ll tailor the guidance to your country and request.');$('#aiForm').onsubmit=async e=>{e.preventDefault();const q=aiInput.value.trim();if(!q)return;aiAdd('user',q);aiInput.value='';try{const r=await fetch('/api/ai/public-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:[],country:'Nigeria',role:authRole})});const d=await r.json();aiAdd('bot',d.reply||'I could not answer that right now.')}catch{aiAdd('bot','I’m temporarily unable to connect. Please try again shortly.')}};
