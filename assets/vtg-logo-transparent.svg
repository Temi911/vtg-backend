<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 464" role="img" aria-labelledby="title desc">
<title id="title">Vintage Trade Global</title>
<desc id="desc">VTG red logo with transparent background.</desc>
<defs>
  <filter id="recolorLogo" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
    <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="luma"/>
    <feComponentTransfer in="luma" result="cutout">
      <feFuncA type="discrete" tableValues="1 1 1 1 0"/>
    </feComponentTransfer>
    <feFlood flood-color="#7D0200" flood-opacity="1" result="vtgRed"/>
    <feComposite in="vtgRed" in2="cutout" operator="in"/>
  </filter>
</defs>
<image href="/assets/vtg-logo-final.webp?v=20260924-blue-source" x="0" y="0" width="1200" height="464" preserveAspectRatio="none" filter="url(#recolorLogo)"/>
</svg>