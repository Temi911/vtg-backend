<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17191b"><title>Trade agent registration — VTG</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="/vtg-supabase-auth.js?v=20261105-auth-1"></script>
<style>
:root{color-scheme:light;--bg:#f3efe6;--panel:#fffdf8;--ink:#202326;--muted:#6f706d;--line:#ddd7cb;--accent:#702a30;--brass:#b49a70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Manrope,Arial,sans-serif}.wrap{width:min(720px,calc(100% - 32px));margin:44px auto}.brand{font-size:11px;letter-spacing:.22em;color:var(--brass);font-weight:800}.panel{margin-top:18px;padding:clamp(22px,5vw,42px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 65px #30291c12}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}h1{font-size:clamp(27px,5vw,38px);line-height:1.15;margin:12px 0}.intro{color:var(--muted);line-height:1.7;margin:0 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:700}input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:7px;background:white;color:#202326;font:inherit}button{margin-top:22px;width:100%;padding:15px;border:0;border-radius:7px;background:var(--accent);color:white;font:700 14px Manrope;cursor:pointer}button:disabled{opacity:.6}.message{min-height:24px;margin-top:16px;color:var(--accent);line-height:1.6}.bottom{margin-top:22px;color:var(--muted);font-size:13px}.bottom a{color:var(--accent);font-weight:700;text-decoration:none}@media(max-width:580px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{margin:24px auto}}
</style></head><body><main class="wrap"><div class="brand">VINTAGE AFRICA TRADE</div><section class="panel"><div class="eyebrow">Trade services network</div><h1>Register as a trade agent.</h1><p class="intro">Create your account and submit your agency details for VTG review. Agent access is enabled only after administrator approval and applicable verification.</p>
<form id="agentForm"><div class="grid">
<div class="field"><label for="agencyName">Agency / business name *</label><input id="agencyName" name="agencyName" required maxlength="140"></div>
<div class="field"><label for="agentType">Service category *</label><select id="agentType" name="agentType" required><option value="trade_agent">Trade agent</option><option value="clearing_forwarding">Clearing & forwarding</option><option value="logistics">Logistics</option><option value="inspection">Inspection</option><option value="sourcing">Sourcing</option><option value="banking">Banking services</option><option value="other">Other</option></select></div>
<div class="field"><label for="country">Country *</label><input id="country" name="country" required maxlength="80"></div>
<div class="field"><label for="city">City *</label><input id="city" name="city" required maxlength="80"></div>
<div class="field"><label for="fullName">Your full name *</label><input id="fullName" name="fullName" required autocomplete="name"></div>
<div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" required autocomplete="email"></div>
<div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
<div class="field"><label for="licenseNumber">License / registration number</label><input id="licenseNumber" name="licenseNumber"></div>
<div class="field full"><label for="password">Create password *</label><input id="password" name="password" type="password" minlength="8" pattern="(?=.*[A-Z])(?=.*\d).{8,}" title="Use at least 8 characters, one uppercase letter and one number." required autocomplete="new-password"></div>
</div><button id="submitAgent" type="submit">Submit agent application</button><div class="message" id="agentMessage" role="status" aria-live="polite"></div></form>
<div class="bottom">Already registered? <a href="/signin.html?role=agent">Sign in</a> · <a href="/signup.html">Other account types</a></div>
</section></main>
<script>
document.getElementById("agentForm").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,button=document.getElementById("submitAgent"),msg=document.getElementById("agentMessage"),d=Object.fromEntries(new FormData(form));button.disabled=true;msg.textContent="Submitting your secure application…";try{const auth=await window.VTG_AUTH_READY;const {data,error}=await auth.signUp(d.email,d.password,{requested_role:"agent",organization_name:d.agencyName,registration_reference:d.licenseNumber||"",full_name:d.fullName,phone:d.phone||"",preferred_language:"en",country:d.country,city:d.city,agentType:d.agentType,licenseNumber:d.licenseNumber||""});if(error)throw error;msg.textContent=data.session?"Application created. Opening your VTG verification page…":"Application submitted. Check your email and follow the confirmation link. VTG administrator review is required before agent access is enabled.";if(data.session)setTimeout(()=>location.href="/verification.html",900);else button.disabled=false;}catch(err){msg.textContent=err.message||"Could not submit your application.";button.disabled=false;}});
</script></body></html>
