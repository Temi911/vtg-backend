<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG Trade Network</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#f6f8fa;--card:#fff;--ink:#17202a;--muted:#687684;--line:#dfe5ea;--accent:#b91c1c;--soft:#fff4f4;--ok:#166534;--okbg:#ecfdf3}html[data-theme=dark]{--bg:#0d1117;--card:#11161d;--ink:#eef3f6;--muted:#b9c5ce;--line:#2b3640;--soft:#241719;--ok:#86efac;--okbg:#10251a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}h1{margin:5px 0}.muted{color:var(--muted)}button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 13px;font-weight:700}select{min-width:160px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.role{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--accent)}.name{font-size:18px;font-weight:800;margin:6px 0}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--okbg);color:var(--ok);font-size:10px;font-weight:800}.actions{display:flex;gap:8px;margin-top:14px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.notice{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:18px}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">Vintage Trade Global</div><h1>Trade Network</h1><div class="muted">Connect with verified suppliers, banks and inspection agents.</div></div><button onclick="location.href='/trade-os.html'">Back to Trade OS</button></div><div class="notice">VTG displays verified network participants only. A network connection is a workflow relationship; it is not an endorsement of a transaction or a guarantee of performance.</div><div class="toolbar"><select id="role"><option value="">All verified partners</option><option value="supplier">Suppliers</option><option value="bank">Banks</option><option value="agent">Agents</option></select><button id="refresh">Refresh</button></div><div id="list" class="grid"><div class="empty">Loading verified partners…</div></div></main><script>(async()=>{const token=localStorage.getItem('vtg_access_token');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!token){document.getElementById('list').innerHTML='<div class="empty">Please sign in to view the trade network.</div>';return}const role=document.getElementById('role').value;const r=await fetch('/api/network/directory'+(role?'?role='+encodeURIComponent(role):''),{headers:{Authorization:'Bearer '+token}});const j=await r.json();if(!r.ok){document.getElementById('list').innerHTML='<div class="empty">'+esc(j.error?.message||j.message||'Unable to load network')+'</div>';return}const rows=j.partners||[];document.getElementById('list').innerHTML=rows.length?rows.map(p=>'<article class="card"><div class="role">'+esc(p.role)+'</div><div class="name">'+esc(p.name)+'</div><span class="badge">Verified</span>'+(p.location?'<p class="muted">'+esc(p.location)+'</p>':'')+(p.regions?'<p class="muted">Regions: '+esc(Array.isArray(p.regions)?p.regions.join(', '):p.regions)+'</p>':'')+'<div class="actions"><button class="primary" data-id="'+esc(p.id)+'" data-role="'+esc(p.role)+'">Request connection</button></div></article>').join(''):'<div class="empty">No verified partners found.</div>'}document.getElementById('refresh').onclick=load;document.getElementById('role').onchange=load;document.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;const r=await fetch('/api/network/relationships',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({partnerId:b.dataset.id,partnerType:b.dataset.role,note:'VTG Trade Network connection request'})});const j=await r.json();alert(r.ok?'Connection request submitted.':(j.error?.message||j.message||'Request failed'))});load()})();</script><script src="/vtg-site-navigation.js?v=20261010-auto-theme" defer></script>
</body></html>
