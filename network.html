<title>VTG Trade Network</title>
<script>
(function () {
  var role = '';
  try {
    var auth = JSON.parse(localStorage.getItem('vtg-auth') || 'null');
    role = String(auth && auth.user && auth.user.role || '').toLowerCase();
  } catch (e) {}
  var destinations = {
    buyer: '/buyer-dashboard.html#network',
    supplier: '/supplier-dashboard.html#network',
    bank: '/bank-trade-os.html',
    agent: '/agent-network-dashboard.html',
    admin: '/admin-dashboard-preview.html'
  };
  var target = destinations[role];
  if (!target) {
    target = '/signin.html?role=buyer&next=%2Fbuyer-dashboard.html%23network';
  }
  location.replace(target);
})();
</script>

</head>
