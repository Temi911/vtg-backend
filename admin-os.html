<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG Admin OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#17202a;--muted:#687684;--line:#dfe5ea;--accent:#b91c1c;--soft:#fff4f4}html[data-theme=dark]{--bg:#0d1117;--card:#11161d;--ink:#eef3f6;--muted:#b9c5ce;--line:#2b3640;--soft:#241719}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}h1{margin:4px 0;font-size:30px}.muted{color:var(--muted)}button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 16px #00000008}.k{font-size:12px;color:var(--muted);font-weight:700}.v{font-size:28px;font-weight:800;margin-top:6px}.sections{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}.row:last-child{border-bottom:0}.badge{font-size:11px;font-weight:800;border-radius:999px;padding:5px 9px;background:var(--soft)}.error{padding:14px;border:1px solid #ef4444;border-radius:12px;margin-top:16px;color:#b91c1c}.users{margin-top:18px;overflow:auto}.user{display:grid;grid-template-columns:1.2fr 1.5fr .7fr 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:700px}.head{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.sections{grid-template-columns:1fr}}@media(max-width:500px){.wrap{padding:18px}.grid{grid-template-columns:1fr 1fr}h1{font-size:24px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">Vintage Trade Global</div><h1>Admin Operations Centre</h1><div class="muted">Platform-wide monitoring, verification and trade controls.</div></div><button id="refresh">Refresh</button></div><div id="app"><div class="muted">Loading admin data…</div></div></main>
<script>
const token=localStorage.getItem('vtg_access_token');const api='/api';const theme=localStorage.getItem('vtg-theme')||'light';document.documentElement.dataset.theme=theme;
async function get(p){const r=await fetch(api+p,{headers:{Authorization:'Bearer '+token}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error?.message||j.message||'Request failed');return j}
const count=(a,s)=>Number((a||[]).find(x=>x.status===s)?.count||0);
async function load(){if(!token)throw new Error('Please sign in as an administrator.');const [d,u]=await Promise.all([get('/admin/dashboard'),get('/admin/users')]);const totalUsers=d.users.reduce((n,x)=>n+Number(x.count),0);document.getElementById('app').innerHTML=
'<section class="grid"><div class="card"><div class="k">Total users</div><div class="v">'+totalUsers+'</div></div><div class="card"><div class="k">Pending verification docs</div><div class="v">'+d.verification.pending+'</div></div><div class="card"><div class="k">Open orders</div><div class="v">'+(count(d.orders,'pending')+count(d.orders,'confirmed')+count(d.orders,'lc_issued')+count(d.orders,'shipped')+count(d.orders,'in_transit')+count(d.orders,'arrived')+count(d.orders,'customs'))+'</div></div><div class="card"><div class="k">LCs awaiting action</div><div class="v">'+(count(d.lcs,'requested')+count(d.lcs,'docs_presented'))+'</div></div></section>'+
'<section class="sections"><div class="card"><h3>Verification Centre</h3><div class="row"><span>Pending</span><b>'+d.verification.pending+'</b></div><div class="row"><span>Verified</span><b>'+d.verification.verified+'</b></div><div class="row"><span>Rejected</span><b>'+d.verification.rejected+'</b></div><p class="muted">Use the existing verification review queue for document decisions.</p><button onclick="location.href='/verification.html'">Open Verification</button></div>'+
'<div class="card"><h3>Trade Control</h3><div class="row"><span>Orders</span><span class="badge">'+d.orders.reduce((n,x)=>n+Number(x.count),0)+'</span></div><div class="row"><span>LCs</span><span class="badge">'+d.lcs.reduce((n,x)=>n+Number(x.count),0)+'</span></div><div class="row"><span>Payments</span><span class="badge">'+d.payments.reduce((n,x)=>n+Number(x.count),0)+'</span></div><div class="row"><span>Shipments</span><span class="badge">'+d.shipments.reduce((n,x)=>n+Number(x.count),0)+'</span></div></div></section>'+
'<section class="card users"><h3>Recent Accounts</h3><div class="user head"><span>Name</span><span>Email</span><span>Role</span><span>Verification</span></div>'+u.users.map(x=>'<div class="user"><span>'+esc(x.full_name)+'</span><span>'+esc(x.email)+'</span><span>'+esc(x.role)+'</span><span>'+esc(x.business_verification_status||'not_required')+'</span></div>').join('')+'</section>'}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}document.getElementById('refresh').onclick=()=>load().catch(e=>document.getElementById('app').innerHTML='<div class="error">'+esc(e.message)+'</div>');load().catch(e=>document.getElementById('app').innerHTML='<div class="error">'+esc(e.message)+'</div>');
</script></body></html>
