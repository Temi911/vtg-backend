<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG My Product Verifications</title><style>:root{--r:#8f1d17;--bg:#f5f8f9;--card:#fff;--ink:#24110f;--muted:#667085;--line:#dce5e8;--good:#16845b;--warn:#ad7518}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top img{width:160px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--r);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.btn.alt{background:#edf1f2;color:#24343b}.hero{margin:22px 0;background:linear-gradient(135deg,#3a0f0d,#8f1d17);color:#fff;padding:28px;border-radius:18px}.hero h1{margin:7px 0;font-size:32px}.hero p{max-width:750px;line-height:1.65;color:#eadedd}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.item{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#edf1f2;text-transform:uppercase}.approved{background:#eaf7f0;color:var(--good)}.pending{background:#fff5e5;color:var(--warn)}.rejected{background:#fdeeee;color:#9f3535}.muted{color:var(--muted);font-size:12px;line-height:1.6}.report,.evidence{margin-top:12px;padding:12px;border-top:1px solid var(--line);line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}@media(max-width:650px){.row{align-items:flex-start;flex-direction:column}}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/vtg-typography.css?v=20261020-global-manrope-1" data-vtg-typography="1">
<style id="vtg-buyer-verifications-premium-refresh">
/* Buyer verification records: improve status and evidence hierarchy without changing report data or actions. */
:root{--bg:#f7f5f0;--panel:#fffefa;--line:#ddd6cb;--text:#242321;--muted:#625d56;--red:#702a30}
body{background:#f7f5f0;color:#242321}
.wrap{max-width:1180px;padding:clamp(20px,4vw,42px) 18px 70px}
.top{background:#702a30}
h1,h2,h3{color:#202326;letter-spacing:-.03em}
.hero{padding:clamp(24px,4vw,40px) 0}
.hero p,.muted{color:#625d56;line-height:1.75}
.btn{min-height:40px;border:1px solid #d7ccc0;border-radius:9px;background:#fffefa;color:#302a26;padding:10px 14px}
.btn.primary{background:#702a30;border-color:#702a30;color:#fff}
.btn.alt{background:#f2e9e5;border-color:#e0c9c4;color:#702a30}
.card{border:1px solid #e0d8ce;border-radius:15px;background:#fffefa;box-shadow:0 9px 26px rgba(30,25,22,.04);padding:clamp(16px,2.5vw,24px)}
.item{border:1px solid #e0d8ce;border-radius:12px;background:#fffefa;overflow:hidden}
.row{gap:12px;padding:14px}
.tag{border:1px solid #e0c9c4;border-radius:7px;background:#f2e9e5;color:#702a30}
.approved{background:#e8f3ec!important;border-color:#b7d9c4!important;color:#235c40!important}
.pending{background:#f6edda!important;border-color:#e5d1a0!important;color:#7b5b24!important}
.rejected{background:#f8e9e8!important;border-color:#e3b9b5!important;color:#8c2e2a!important}
.report,.evidence{border:1px solid #e0d8ce;border-radius:10px;background:#faf6f0;color:#393530;padding:13px}
.actions{gap:8px}
html[data-theme="dark"] body{background:#17191b;color:#f3efe6}
html[data-theme="dark"] h1,html[data-theme="dark"] h2,html[data-theme="dark"] h3{color:#f3efe6}
html[data-theme="dark"] .hero p,html[data-theme="dark"] .muted{color:#c5bfb5}
html[data-theme="dark"] .card,html[data-theme="dark"] .item{background:#202326;border-color:#3b3d40}
html[data-theme="dark"] .row{border-color:#3b3d40}
html[data-theme="dark"] .tag{background:#43282a;border-color:#65464a;color:#f2c6c2}
html[data-theme="dark"] .approved{background:#1e3a30!important;border-color:#315c49!important;color:#b4e4c8!important}
html[data-theme="dark"] .pending{background:#41351e!important;border-color:#68532a!important;color:#efd39a!important}
html[data-theme="dark"] .rejected{background:#432627!important;border-color:#75413e!important;color:#f2c6c2!important}
html[data-theme="dark"] .report,html[data-theme="dark"] .evidence{background:#292522;border-color:#45403c;color:#d4ccc2}
html[data-theme="dark"] .btn:not(.primary){background:#292b2d;border-color:#45484b;color:#f3efe6}
@media(max-width:680px){.wrap{padding-inline:13px}.card{padding:15px}.row{padding:11px}}
</style>
</head><body><main class="wrap"><div class="top"><a href="/"><img src="/assets/vtg-logo.svg" alt="VTG"></a><div><a class="btn alt" href="/product-verification.html">New verification</a> <a class="btn alt" href="/buyer-dashboard.html#verification">Buyer dashboard</a></div></div><section class="hero"><small>BUYER VERIFICATION CENTRE</small><h1>My Product Verifications</h1><p>Review your inspection request, payment, agent report and evidence before making a shipment decision.</p></section><section class="card"><div class="row"><div><h2>Inspection history</h2><div class="muted">Your verification records stay attached to the trade request.</div></div><button class="btn" onclick="load()">Refresh</button></div><div id="list">Loading…</div></section></main><script>const $=s=>document.querySelector(s),token=()=>localStorage.getItem('vtg_access_token')||'';async function api(p,o={}){o.headers=Object.assign({'Authorization':'Bearer '+token()},o.headers||{});return fetch('/api'+p,o)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){if(!token())return location.href='/';const r=await api('/inspections/requests/mine');const d=await r.json();if(!r.ok)return $('#list').textContent=d.message||'Unable to load requests.';$('#list').innerHTML=(d.requests||[]).map(x=>{const paid=x.payment_status==='paid',awaiting=x.status==='awaiting_buyer';return '<div class="item"><div class="row"><div><b>'+esc(x.reference)+'</b><div class="muted">'+esc(x.product_name)+' • '+esc(x.quantity)+' • '+esc(x.city)+', '+esc(x.country)+' • Agent: '+esc(x.agent_name||'Awaiting agent')+'</div></div><span class="tag">'+esc(x.status.replaceAll('_',' '))+'</span></div><div class="muted" style="margin-top:8px">Inspection fee: $'+Number(x.buyer_fee_usd||0).toFixed(2)+' <span class="tag '+(paid?'approved':'pending')+'">'+(paid?'Payment confirmed':'Payment: '+esc(x.payment_status||'unpaid'))+'</span></div>'+(x.inspection_summary?'<div class="report"><b>Agent report</b><br>'+esc(x.inspection_summary)+'</div>':'<div class="muted" style="margin-top:10px">Agent report not submitted yet.</div>')+'<div class="actions"><button class="btn alt" onclick="evidence(\''+x.id+'\')">View evidence</button>'+(paid?'':'<button class="btn" onclick="pay(\''+x.id+'\')">Pay inspection fee</button>')+(awaiting?'<button class="btn" onclick="decide(\''+x.id+'\',\'approved\')">Approve for shipment</button><button class="btn alt" onclick="decide(\''+x.id+'\',\'needs_clarification\')">Request clarification</button><button class="btn alt" onclick="decide(\''+x.id+'\',\'rejected\')">Reject inspection</button>':'')+'</div><div id="ev-'+x.id+'" class="evidence muted">Evidence details will appear here.</div></div>'}).join('')||'<p class="muted">You have no product verification requests yet.</p>')}window.pay=async id=>{const r=await api('/inspections/requests/'+id+'/payment/initialize',{method:'POST'});const d=await r.json();if(!r.ok)return alert(d.message||d.error?.message||'Unable to initialize payment');if(d.paid)return load();if(!d.authorizationUrl)return alert('Payment checkout is unavailable. Please contact VTG support.');location.href=d.authorizationUrl};window.evidence=async id=>{const r=await api('/inspections/requests/'+id+'/evidence');const d=await r.json();if(!r.ok)return alert(d.message||'Unable to load evidence');const list=d.evidence||[];$('#ev-'+id).innerHTML='<b>Evidence ('+list.length+')</b><br>'+ (list.length?list.map(e=>esc(e.evidence_type)+' • '+esc(e.file_name)+' • '+new Date(e.created_at).toLocaleString()+' <button class="btn alt" onclick="downloadEvidence(\''+e.id+'\')">Download</button>').join('<br>'):'No evidence uploaded yet.');};window.downloadEvidence=async id=>{const r=await api('/inspections/evidence/'+id+'/download');if(!r.ok)return alert('Unable to download evidence.');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='VTG-inspection-evidence';a.click();URL.revokeObjectURL(u)};window.decide=async(id,decision)=>{let notes='';if(decision!=='approved')notes=prompt(decision==='rejected'?'Why are you rejecting this inspection?':'What clarification do you need?')||'';if(decision!=='approved'&&!notes)return;const r=await api('/inspections/requests/'+id+'/decision',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,notes})});const d=await r.json();if(!r.ok)return alert(d.message||'Could not update decision');load()};load();</script><script src="/vtg-site-navigation.js?v=20261023-no-footer-2" defer></script>

<style id="vtg-buyer-verifications-theme-20261016">
:root{--r:#a5232b;--bg:#f4f6f8;--card:#fff;--ink:#20252d;--muted:#687586;--line:#e1e6ed;--good:#18734b;--warn:#986416;--soft:#fff0ef}

body{background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif}

.card{box-shadow:0 12px 34px rgba(22,31,43,.055);border-radius:16px}
.item{background:var(--card);border-color:var(--line);border-radius:12px}
.btn{background:#a5232b;border-radius:10px;min-height:39px}

</style>
</body></html>
