<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG My Product Verifications</title><style>:root{--r:#8f1d17;--bg:#f5f8f9;--card:#fff;--ink:#24110f;--muted:#667085;--line:#dce5e8;--good:#16845b;--warn:#ad7518}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px 18px}.top{display:flex;justify-content:space-between;align-items:center}.top img{width:160px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--r);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.btn.alt{background:#edf1f2;color:#24343b}.hero{margin:22px 0;background:linear-gradient(135deg,#3a0f0d,#8f1d17);color:#fff;padding:28px;border-radius:18px}.hero h1{margin:7px 0;font-size:32px}.hero p{max-width:750px;line-height:1.65;color:#eadedd}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.item{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#edf8f8;color:#0b6c73}.approved{background:#eaf7f0;color:var(--good)}.pending{background:#fff5e5;color:var(--warn)}.rejected{background:#fdeeee;color:#9f3535}.muted{color:var(--muted);font-size:12px;line-height:1.6}.evidence{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}@media(max-width:650px){.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><a href="/"><img src="/assets/vtg-logo.svg" alt="VTG"></a><div><a class="btn alt" href="/product-verification.html">New verification</a> <a class="btn alt" href="/trade-os.html">Trade OS</a></div></div><section class="hero"><small>BUYER VERIFICATION CENTRE</small><h1>My Product Verifications</h1><p>Review your VTG inspection requests, submitted reports and evidence before deciding whether your goods are ready for shipment.</p></section><section class="card"><div class="row"><div><h2>Inspection history</h2><div class="muted">Your verification records stay attached to the trade request.</div></div><button class="btn" onclick="load()">Refresh</button></div><div id="list">Loading…</div></section></main><script>const $=s=>document.querySelector(s),token=()=>localStorage.getItem('vtg_access_token')||'';async function api(p,o={}){o.headers=Object.assign({'Authorization':'Bearer '+token()},o.headers||{});return fetch('/api'+p,o)}async function load(){if(!token())return location.href='/';const r=await api('/inspections/requests/mine');const d=await r.json();if(!r.ok)return $('#list').textContent=d.message||'Unable to load requests.';$('#list').innerHTML=(d.requests||[]).map(x=>'<div class="item"><div class="row"><div><b>'+x.reference+'</b><div class="muted">'+x.product_name+' • '+x.quantity+' • '+x.city+', '+x.country+' • '+(x.agent_name||'Awaiting agent')+'</div></div><span class="tag '+x.status+'">'+x.status.replaceAll('_',' ')+'</span></div><div class="muted" style="margin-top:8px">Inspection fee: $'+Number(x.buyer_fee_usd).toFixed(2)+(x.inspection_summary?'<br><b>Agent report:</b> '+x.inspection_summary:'')+'</div><div class="evidence"><button class="btn alt" onclick="evidence(\''+x.id+'\')">View evidence</button>'+(x.status==='awaiting_buyer'?'<button class="btn" style="margin-left:7px" onclick="decide(\''+x.id+'\',\'approved\')">Approve for shipment</button><button class="btn alt" style="margin-left:7px" onclick="decide(\''+x.id+'\',\'needs_clarification\')">Request clarification</button>':'')+'</div><div id="ev-'+x.id+'" class="muted"></div></div>').join('')||'<p class="muted">You have no product verification requests yet.</p>'}window.evidence=async id=>{const r=await api('/inspections/requests/'+id+'/evidence');const d=await r.json();if(!r.ok)return alert(d.message||'Unable to load evidence');$('#ev-'+id).innerHTML=(d.evidence||[]).length?d.evidence.map(e=>e.evidence_type+' • '+e.file_name+' • '+new Date(e.created_at).toLocaleString()).join('<br>'):'No evidence uploaded yet.'};window.decide=async(id,decision)=>{let notes='';if(decision==='needs_clarification')notes=prompt('What clarification do you need?')||'';const r=await api('/inspections/requests/'+id+'/decision',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,notes})});const d=await r.json();if(!r.ok)return alert(d.message||'Could not update decision');load()};load();</script></body></html>
