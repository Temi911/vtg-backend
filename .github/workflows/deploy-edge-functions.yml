name: Deploy Supabase edge functions (manual)

# Run this by hand: GitHub → Actions → "Deploy Supabase edge functions (manual)" → Run workflow.
# One-time setup: add a repository secret named SUPABASE_ACCESS_TOKEN
# (Supabase dashboard → Account → Access Tokens). Never put it in code or chat.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Space-separated function names, or 'all'"
        required: true
        default: "vtg-email vtg-admin-roles"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lxrurbdzphqvkjprlfuv
      FUNCTIONS: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is missing." && exit 1
          fi
      - name: Deploy
        run: |
          if [ "$FUNCTIONS" = "all" ]; then
            for d in supabase/functions/*/; do
              n=$(basename "$d"); [ "$n" = "_shared" ] && continue
              echo "Deploying $n"; supabase functions deploy "$n" --project-ref "$PROJECT_REF"
            done
          else
            for n in $FUNCTIONS; do
              [ -d "supabase/functions/$n" ] || { echo "Unknown function: $n"; exit 1; }
              echo "Deploying $n"; supabase functions deploy "$n" --project-ref "$PROJECT_REF"
            done
          fi
