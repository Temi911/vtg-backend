name: VTG backend tests

on:
  push:
    branches:
      - phase-2-auth-onboarding
  pull_request:
    paths:
      - "vtg-backend/**"
      - ".github/workflows/vtg-backend-tests.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vtg-backend
    steps:
      - name: Check out the branch being tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vtg-backend/package-lock.json
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile sync when needed
        working-directory: .
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if ! git diff --quiet -- vtg-backend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vtg-backend/package-lock.json
            git commit -m "Sync backend npm lockfile"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
