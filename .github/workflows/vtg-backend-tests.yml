name: VTG backend tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'claude/redesign-public-pages']

permissions:
  contents: read

concurrency:
  group: vtg-backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vtg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vtg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vtg_test
      NODE_ENV: test
    defaults:
      run:
        working-directory: vtg-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vtg-backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply all database migrations to a clean PostgreSQL database
        run: node src/db/migrate.js
      - name: Run tests
        run: npm test


  supabase-validation:
    name: Supabase migration and Edge Function validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vtg_supabase_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vtg_supabase_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vtg_supabase_validation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build the isolated Supabase schema contract
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/vtg_trade_workflow_hardening_prerequisites.sql
      - name: Apply the VTG workflow-hardening migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106123000_vtg_trade_workflow_hardening.sql
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check changed VTG Edge Functions
        run: |
          deno check supabase/functions/vtg-inspection-payments/index.ts
          deno check supabase/functions/vtg-bank-trade-workspace/index.ts
          deno check supabase/functions/vtg-finance-inspections/index.ts
          deno check supabase/functions/vtg-trade-operations/index.ts
          deno check supabase/functions/vtg-live-tracking/index.ts
          deno check supabase/functions/vtg-wallet/index.ts
