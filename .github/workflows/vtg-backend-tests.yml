name: VTG backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vtg-backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vtg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vtg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vtg_test
      NODE_ENV: test
    defaults:
      run:
        working-directory: vtg-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vtg-backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply all database migrations to a clean PostgreSQL database
        run: node src/db/migrate.js
      - name: Run tests
        run: npm test
