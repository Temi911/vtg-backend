name: VTG backend tests

on:
  push:
    branches:
      - main
      - phase-1-site-stability
      - phase-2-auth-onboarding
  pull_request:
    paths:
      - "vtg-backend/**"
      - ".github/workflows/vtg-backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vtg-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vtg-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
