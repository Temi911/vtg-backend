name: Patch marketplace CTA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add marketplace CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("frontend-v3.html")
          s=p.read_text()
          old='<div class="trust"><span>Verified profiles</span><span>Buyer enquiries</span><span>Supplier storefronts</span><span>Bank participation</span><span>Trade locations</span><span>Transparent transaction design</span></div>'
          new=old+'<div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap"><a class="primary" href="/marketplace" style="display:inline-flex;align-items:center;gap:7px">Explore Marketplace <i data-lucide="arrow-up-right"></i></a><a class="outline" href="/marketplace" style="display:inline-flex;align-items:center;gap:7px">Browse supplier catalogue <i data-lucide="search"></i></a></div>'
          if old not in s:
              raise SystemExit("Marketplace trust block not found")
          if 'href="/marketplace"' in s and 'Explore Marketplace' in s:
              raise SystemExit("CTA already present")
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-v3.html
          git rm .github/workflows/patch-marketplace.yml
          git commit -m "Fix landing marketplace entry point"
          git push
