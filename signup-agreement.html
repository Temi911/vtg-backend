<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>VTG — Privacy & Signup Agreement</title>
<style>
:root{--red:#8f1d17;--deep:#210b09;--cream:#f5f8f8;--white:#fff;--ink:#251311;--muted:#667085;--line:#e4e7ec;--soft:#f9eeee}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Manrope',sans-serif}.top{height:5px;background:linear-gradient(90deg,#a93226,#f0ca76,#c0392b,#8f1d17)}
.wrap{max-width:860px;margin:38px auto;padding:0 20px}.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 55px rgba(7,31,48,.10)}.brand{color:var(--red);font-weight:800;letter-spacing:.08em;font-size:12px;text-transform:uppercase}.eyebrow{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:25px}.title{font-size:34px;line-height:1.1;margin:8px 0 10px}.lead{color:var(--muted);line-height:1.7;font-size:14px}.section{padding-top:22px;border-top:1px solid var(--line);margin-top:22px}.section h2{font-size:18px;margin:0 0 8px}.section p,.section li{font-size:12px;line-height:1.7;color:#53606b}.section ul{padding-left:20px}.check{margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--soft);display:flex;gap:11px;align-items:flex-start;font-size:12px;line-height:1.6}.check input{width:18px;height:18px;accent-color:var(--red);margin-top:2px}.check a{color:var(--red);font-weight:700}.actions{display:flex;gap:10px;align-items:center;margin-top:18px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.outline{background:#fff;border:1px solid var(--line);color:var(--red)}.msg{min-height:18px;margin-top:10px;font-size:11px;color:#b42318}.msg.ok{color:#23855b}.note{font-size:10px;color:var(--muted);margin-top:18px}.loading{text-align:center;padding:60px;color:var(--muted)}
@media(max-width:600px){.wrap{margin:18px auto;padding:0 12px}.card{padding:21px}.title{font-size:28px}.actions{flex-direction:column;align-items:stretch}.actions .btn{width:100%}}
</style>
</head>
<body><div class="top"></div><main class="wrap"><div class="card" id="app"><div class="loading">Loading your VTG agreement…</div></div></main>
<script>
const API='';
const auth=JSON.parse(localStorage.getItem('vtg-auth')||'{}'); const token=localStorage.getItem('vtg_access_token')||auth.accessToken||'';
const app=document.getElementById('app');
function nextForRole(role){if(role==='supplier'||role==='bank')return '/verification.html';if(role==='agent')return '/agent-dashboard.html';return '/trade-os.html'}
async function api(path,options={}){return fetch(API+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(options.headers||{})})}
async function load(){
 if(!token){location.href='/';return}
 try{
  const r=await api('/api/auth/me'); const d=await r.json();
  if(!r.ok)throw new Error(d.message||'Your session has expired.');
  if(!d.agreementRequired){location.href=nextForRole(d.user.role);return}
  app.innerHTML=`
   <div class="brand">Vintage Trade Global</div>
   <div class="eyebrow">Required before workspace access</div>
   <h1 class="title">Privacy & Signup Agreement</h1>
   <p class="lead">Before you enter your VTG workspace, please review the information below and confirm that you have read and understood the VTG Privacy Policy and Signup Agreement.</p>
   <div class="section"><h2>1. Account information</h2><p>VTG uses the information you provide to create and operate your account, verify your email and role, support trade activity, communicate with you, and provide the services connected to your workspace.</p></div>
   <div class="section"><h2>2. Business and verification information</h2><p>Where your role requires verification, VTG may review business, institutional, licence and supporting documents you submit. Verification does not guarantee a transaction, supplier relationship, financing, shipment, or other commercial outcome.</p></div>
   <div class="section"><h2>3. Your responsibilities</h2><ul><li>Provide information that is accurate and kept reasonably up to date.</li><li>Keep your password and account credentials private.</li><li>Use VTG only for lawful and legitimate trade activities.</li><li>Do not misrepresent your business, institution, products, documents or authority.</li></ul></div>
   <div class="section"><h2>4. Privacy</h2><p>VTG will handle personal and business information in accordance with its Privacy Policy and applicable data-protection requirements. You may review the <a href="/privacy.html" target="_blank" rel="noopener">VTG Privacy Policy</a> before accepting.</p></div>
   <div class="section"><h2>5. Signup and platform terms</h2><p>Your use of VTG is also subject to the <a href="/terms.html" target="_blank" rel="noopener">VTG Signup & Platform Agreement</a>, including rules for account use, verification, marketplace activity, communications, payments, inspections and other platform services.</p></div>
   <label class="check"><input id="agree" type="checkbox"><span>I confirm that I have read and understood the VTG Privacy Policy and Signup & Platform Agreement, and I agree to them for use of my VTG account.</span></label>
   <div class="actions"><button id="accept" class="btn primary" disabled>Accept & enter VTG</button><button id="logout" class="btn outline">Sign out</button></div>
   <div id="msg" class="msg"></div>
   <p class="note">Agreement version: 2026-09-01. VTG records the acceptance time and account/IP context for compliance and audit purposes.</p>`;
  const agree=document.getElementById('agree'),accept=document.getElementById('accept'),msg=document.getElementById('msg');
  agree.onchange=()=>accept.disabled=!agree.checked;
  accept.onclick=async()=>{accept.disabled=true;msg.textContent='Saving your acceptance…';try{const r=await api('/api/auth/agreements/accept',{method:'POST',body:'{}'});const d=await r.json();if(!r.ok)throw new Error(d.message||'Could not save your acceptance.');msg.className='msg ok';msg.textContent='Agreement accepted. Opening your VTG workspace…';setTimeout(()=>location.href=nextForRole(d.user?.role||JSON.parse(localStorage.getItem('vtg-auth')||'{}').user?.role||'buyer'),350)}catch(e){msg.className='msg';msg.textContent=e.message;accept.disabled=false}};
  document.getElementById('logout').onclick=()=>{localStorage.removeItem('vtg_access_token');localStorage.removeItem('vtg-auth');location.href='/'};
 }catch(e){app.innerHTML='<div class="eyebrow">VTG Access</div><h1 class="title">Session required</h1><p class="lead">'+e.message+'</p><button class="btn primary" onclick="location.href=\'/\'">Return to VTG</button>'}
}
load();
</script>
<script src="/page-visuals.js"></script>
<script src="/vtg-site-navigation.js" defer></script>
</body></html>
