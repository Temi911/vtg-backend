<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Verifying payment | VTG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vtg-shell.css?v=20261030-1">
<link rel="stylesheet" href="/vtg-flow.css?v=20261031-1">
<script>try{var p=localStorage.getItem('vtg-theme-preference');document.documentElement.setAttribute('data-theme',p==='dark'||(p!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}catch(e){}</script>
</head>
<body class="flow">
<div class="flow-top"></div>
<div class="flow-bar"><div class="vs-wrap"><a href="/frontend-v3.html" aria-label="Vintage Trade Global home"><img src="/assets/vtg-logo.svg" alt="Vintage Trade Global"></a><a class="back" href="/frontend-v3.html">Back to site</a></div></div>
<main class="flow-main" id="main"><div class="flow-card center"><div class="icon" aria-hidden="true">⏳</div><h1>Verifying your inspection payment</h1><p id="msg" class="muted" role="status">Please wait while VTG confirms your payment securely.</p><div class="actions" style="justify-content:center"><a id="go" class="btn primary" href="/buyer-verifications.html" style="display:none">View My Inspections</a></div></div></main>
<script>const token=()=>localStorage.getItem('vtg_access_token')||'';const ref=new URLSearchParams(location.search).get('reference');const msg=document.querySelector('#msg'),go=document.querySelector('#go');async function verify(){if(!token()){msg.textContent='Please sign back into VTG to verify this payment.';go.style.display='inline-block';return}if(!ref){msg.textContent='No payment reference was provided.';go.style.display='inline-block';return}const r=await fetch('/api/inspections/payment/verify?reference='+encodeURIComponent(ref),{headers:{Authorization:'Bearer '+token()}});const d=await r.json();if(r.ok&&d.paid){msg.innerHTML='<b>Payment verified successfully.</b><br>Your inspection request can now be assigned to an approved VTG Agent.'}else if(r.ok&&!d.paid){msg.textContent='The payment is not yet confirmed. Please wait a moment and refresh this page.'}else{msg.textContent=d.message||'We could not verify the payment yet.'}go.style.display='inline-block'}verify();</script>
</body>
</html>
