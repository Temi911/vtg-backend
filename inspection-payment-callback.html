<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG Payment Verification</title><style>body{margin:0;background:#f6f8f9;color:#24110f;font-family:Manrope,Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #dfe6e9;border-radius:16px;padding:25px;text-align:center}img{width:160px}.icon{font-size:42px;margin:18px 0}.btn{display:inline-block;background:#8f1d17;color:#fff;text-decoration:none;padding:11px 16px;border-radius:9px;font-weight:800}.muted{color:#68747d;line-height:1.6;font-size:13px}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/vtg-typography.css?v=20261020-global-manrope-1" data-vtg-typography="1">
</head><body><main class="wrap"><div class="card"><a href="/"><img src="/assets/vtg-logo.svg" alt="VTG"></a><div class="icon">⏳</div><h1>Verifying your inspection payment</h1><p id="msg" class="muted">Please wait while VTG confirms your payment securely.</p><a id="go" class="btn" href="/buyer-verifications.html" style="display:none">View My Inspections</a></div></main><script>
const token=()=>localStorage.getItem('vtg_access_token')||'';
const params=new URLSearchParams(location.search),ref=params.get('reference'),inspectionId=params.get('inspectionId');
const msg=document.querySelector('#msg'),go=document.querySelector('#go');
async function verify(){
 if(!token()){msg.textContent='Please sign back into VTG in this browser, then reopen this payment return link to verify.';go.href='/signin.html?role=buyer&next='+encodeURIComponent(location.pathname+location.search);go.textContent='Sign in to verify';go.style.display='inline-block';return}
 if(!ref||!inspectionId){msg.textContent='The payment return link is missing its reference or inspection ID. Contact VTG support before retrying payment.';go.style.display='inline-block';return}
 try{
  const r=await fetch('https://lxrurbdzphqvkjprlfuv.supabase.co/functions/v1/vtg-inspection-payments',{method:'POST',headers:{'Authorization':'Bearer '+token(),'apikey':'sb_publishable_WX5_k_ie2eO8aIWeUD4YhQ_koVO2TWT','Content-Type':'application/json'},body:JSON.stringify({action:'verify',inspectionId,reference:ref}),cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(r.ok&&d.paid){msg.innerHTML='<b>Payment verified successfully.</b><br>Your inspection request is now eligible for VTG agent assignment.'}
  else if(r.ok&&!d.paid){msg.textContent='The provider has not confirmed the payment yet. Wait briefly, then refresh this page.'}
  else{msg.textContent=d.error||'We could not verify the payment. Contact VTG support with reference '+ref+'.'}
 }catch(e){msg.textContent='Verification service unavailable. Refresh this page shortly; do not pay again while this transaction is pending.'}
 go.href='/buyer-dashboard.html#verification';go.textContent='View My Inspections';go.style.display='inline-block';
}
verify();
</script>
<script src="/page-visuals.js"></script>
<script src="/vtg-site-navigation.js?v=20261020-universal-header-1" defer></script>
</body></html>
