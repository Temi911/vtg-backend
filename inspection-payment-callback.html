<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG Payment Verification</title><style>body{margin:0;background:#f6f8f9;color:#24110f;font-family:Manrope,Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #dfe6e9;border-radius:16px;padding:25px;text-align:center}img{width:160px}.icon{font-size:42px;margin:18px 0}.btn{display:inline-block;background:#8f1d17;color:#fff;text-decoration:none;padding:11px 16px;border-radius:9px;font-weight:800}.muted{color:#68747d;line-height:1.6;font-size:13px}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"></head><body><main class="wrap"><div class="card"><a href="/"><img src="/assets/vtg-logo.svg" alt="VTG"></a><div class="icon">⏳</div><h1>Verifying your inspection payment</h1><p id="msg" class="muted">Please wait while VTG confirms your payment securely.</p><a id="go" class="btn" href="/buyer-verifications.html" style="display:none">View My Inspections</a></div></main><script>const token=()=>localStorage.getItem('vtg_access_token')||'';const ref=new URLSearchParams(location.search).get('reference');const msg=document.querySelector('#msg'),go=document.querySelector('#go');async function verify(){if(!token()){msg.textContent='Please sign back into VTG to verify this payment.';go.style.display='inline-block';return}if(!ref){msg.textContent='No payment reference was provided.';go.style.display='inline-block';return}const r=await fetch('/api/inspections/payment/verify?reference='+encodeURIComponent(ref),{headers:{Authorization:'Bearer '+token()}});const d=await r.json();if(r.ok&&d.paid){msg.innerHTML='<b>Payment verified successfully.</b><br>Your inspection request can now be assigned to an approved VTG Agent.'}else if(r.ok&&!d.paid){msg.textContent='The payment is not yet confirmed. Please wait a moment and refresh this page.'}else{msg.textContent=d.message||'We could not verify the payment yet.'}go.style.display='inline-block'}verify();</script>
<script src="/page-visuals.js"></script>
<script src="/vtg-site-navigation.js" defer></script>
</body></html>
