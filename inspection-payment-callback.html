<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG Payment Verification</title><style>body{margin:0;background:#f6f8f9;color:#24110f;font-family:Manrope,Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #dfe6e9;border-radius:16px;padding:25px;text-align:center}img{width:160px}.icon{font-size:42px;margin:18px 0}.btn{display:inline-block;background:#8f1d17;color:#fff;text-decoration:none;padding:11px 16px;border-radius:9px;font-weight:800}.muted{color:#68747d;line-height:1.6;font-size:13px}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/vtg-typography.css?v=20261020-global-manrope-1" data-vtg-typography="1">
<style id="vtg-inspection-payment-status-premium-refresh">
:root{--bg:#f7f5f0;--panel:#fffefa;--line:#ddd6cb;--text:#242321;--muted:#625d56;--red:#702a30}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(180,154,112,.16),transparent 44%),#f7f5f0;color:#242321;font-family:Manrope,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:min(640px,calc(100% - 30px));margin:0 auto;padding:28px 0}
.card{border:1px solid #ddd6cb;border-radius:20px;background:#fffefa;box-shadow:0 22px 60px rgba(40,30,24,.07);padding:clamp(22px,4vw,38px);text-align:center}
.card>a:first-child{display:inline-flex;margin-bottom:24px}
.card>a:first-child img{width:auto;max-width:150px;max-height:42px;object-fit:contain}
.icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 20px;border:1px solid #e0c9c4;border-radius:16px;background:#f2e9e5;color:#702a30;font-size:24px}
h1{margin:0 0 12px;color:#202326;font-size:clamp(25px,4vw,34px);line-height:1.15;letter-spacing:-.035em}
.muted{color:#625d56;font-size:14px;line-height:1.8}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;margin-top:18px;padding:12px 17px;border:1px solid #702a30;border-radius:10px;background:#702a30;color:#fff;text-decoration:none;font-size:12px;font-weight:750}
.btn:hover{background:#552126}
.btn:focus-visible,a:focus-visible{outline:2px solid #9b5c60;outline-offset:3px}
html[data-theme="dark"] body{background:radial-gradient(ellipse at 50% 0%,rgba(180,154,112,.1),transparent 44%),#17191b;color:#f3efe6}
html[data-theme="dark"] .card{background:#202326;border-color:#3b3d40}
html[data-theme="dark"] h1{color:#f3efe6}
html[data-theme="dark"] .muted{color:#c5bfb5}
html[data-theme="dark"] .icon{background:#43282a;border-color:#65464a;color:#f2c6c2}
</style>
</head><body><main class="wrap"><div class="card"><a href="/"><img src="/assets/vtg-logo.svg" alt="VTG"></a><div class="icon">⏳</div><h1>Verifying your inspection payment</h1><p id="msg" class="muted">Please wait while VTG confirms your payment securely.</p><a id="go" class="btn" href="/buyer-verifications.html" style="display:none">View My Inspections</a></div></main><script>const token=()=>localStorage.getItem('vtg_access_token')||'';const ref=new URLSearchParams(location.search).get('reference');const msg=document.querySelector('#msg'),go=document.querySelector('#go');async function verify(){if(!token()){msg.textContent='Please sign back into VTG to verify this payment.';go.style.display='inline-block';return}if(!ref){msg.textContent='No payment reference was provided.';go.style.display='inline-block';return}const r=await fetch('/api/inspections/payment/verify?reference='+encodeURIComponent(ref),{headers:{Authorization:'Bearer '+token()}});const d=await r.json();if(r.ok&&d.paid){msg.innerHTML='<b>Payment verified successfully.</b><br>Your inspection request can now be assigned to an approved VTG Agent.'}else if(r.ok&&!d.paid){msg.textContent='The payment is not yet confirmed. Please wait a moment and refresh this page.'}else{msg.textContent=d.message||'We could not verify the payment yet.'}go.style.display='inline-block'}verify();</script>
<script src="/page-visuals.js"></script>
<script src="/vtg-site-navigation.js?v=20261023-no-footer-2" defer></script>
</body></html>
