services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vtg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - vtg_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vtg"]
      interval: 10s
      timeout: 5s
      retries: 10

  vtgafricabackend:
    image: vtgafricabackend
    build:
      context: vtg-backend
      dockerfile: ./Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vtg
      DATABASE_SSL: "false"
      CORS_ORIGIN: "*"
    ports:
      - 4000:4000

volumes:
  vtg_pg_data:
