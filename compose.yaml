services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vtg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vtg_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vtg"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    # ClamAV is internal-only; do not publish its port to the host.
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  vtgafricabackend:
    build:
      context: .
      dockerfile: vtg-backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vtg
      DATABASE_SSL: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      UPLOAD_DIR: /usr/src/private-uploads
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MALWARE_SCAN_REQUIRED: "true"
    volumes:
      - vtg_private_uploads:/usr/src/private-uploads
    ports:
      - "4000:4000"

volumes:
  vtg_pg_data:
  vtg_private_uploads:
