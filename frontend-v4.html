<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b57"><title>Vintage Trade Global</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8f8}#vtgFrame{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .18s ease}#vtgFrame.ready{opacity:1}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f5f8f8;color:#123b57;font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;z-index:5}#loading:after{content:'';width:22px;height:22px;border:2px solid #dbe5e9;border-top-color:#0e969f;border-radius:50%;animation:spin .7s linear infinite;margin-left:10px}@keyframes spin{to{transform:rotate(360deg)}}.boot{display:flex;align-items:center;gap:10px}</style></head><body><div id="loading"><div class="boot">Loading Vintage Trade Global</div></div><iframe id="vtgFrame" src="/frontend-v3.html" title="Vintage Trade Global" loading="eager"></iframe><script>(function(){const frame=document.getElementById('vtgFrame'),loading=document.getElementById('loading');const scripts=['/icon-fallback.js','/logo-override.js','/map-enhancer.js','/visual-enhancer.js'];function inject(){try{const doc=frame.contentDocument;if(!doc)return;for(const src of scripts){if(doc.querySelector('script[data-vtg-src="'+src+'"]'))continue;const s=doc.createElement('script');s.src=src+'?v=final-1';s.async=false;s.setAttribute('data-vtg-src',src);doc.body.appendChild(s)}frame.classList.add('ready');loading.style.display='none'}catch(e){console.warn('VTG enhancement boot failed',e);frame.classList.add('ready');loading.style.display='none'}}frame.addEventListener('load',inject);try{if(frame.contentDocument&&frame.contentDocument.readyState==='complete')inject()}catch(e){}})();</script></body></html>
