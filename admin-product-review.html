<!doctype html>
<html lang="en" data-theme="light">
<head>
<script src="/vtg-lang.js?v=20261118-lang-2"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Product review | VTG staff</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#17212b;--muted:#687687;--line:#e1e6ed;--blue:#1558D6;--sun:#FFB81C;--green:#16734a;--red:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0b1016;--card:#141b23;--ink:#f0f4f7;--muted:#b3bfca;--line:#2b3743;--green:#79d7ac;--red:#ff9b95}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Manrope,system-ui,Arial,sans-serif}
header{background:var(--blue);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header strong{letter-spacing:.06em}header a{color:#fff;font-weight:700}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input,textarea,button{font:inherit}select,input,textarea{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 11px}
button{border:0;border-radius:9px;padding:9px 14px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff}
button.ok{background:var(--green)}button.no{background:var(--red)}button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12.5px}.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:800;background:#E4EEFC;color:var(--blue)}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.imgs img{width:84px;height:84px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-top:10px}.actions textarea{flex:1;min-width:220px;min-height:40px}
#msg{min-height:22px;font-weight:700}.empty{padding:28px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
</style>
<link rel="stylesheet" href="/vtg-loader.css?v=20261117-lang-1"><script src="/vtg-loader.js?v=20261117-lang-1" defer></script>
</head>
<body>
<header><strong>VTG STAFF · PRODUCT REVIEW</strong><a href="/admin-os.html">Back to admin</a></header>
<main>
<p class="muted">Approve a supplier listing to make it visible in the buyer marketplace (it also needs a verified supplier). A rejection needs a reason, which the supplier sees. Every decision is recorded with your account.</p>
<div class="bar"><label for="status" class="muted">Show</label><select id="status"><option value="pending">Waiting for review</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="all">All</option></select><button class="alt" id="refresh" type="button">Refresh</button></div>
<div id="msg" role="status" aria-live="polite"></div>
<div id="list"><div class="empty">Loading…</div></div>
</main>
<script src="/vtg-supabase-auth.js?v=20261115-uid-1"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},client=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function say(t,bad){var m=$('msg');m.textContent=t||'';m.style.color=bad?'var(--red)':'var(--green)'}
function safeUrl(u){return /^https:\/\//i.test(String(u||''))?u:''}
async function init(){
  var auth;try{auth=await window.VTG_AUTH_READY}catch(e){}
  client=auth&&auth.client;
  if(!client){$('list').innerHTML='<div class="empty">Secure sign-in is unavailable. Refresh and try again.</div>';return}
  var s=await client.auth.getSession();
  if(!s.data||!s.data.session){location.replace('/admin-signin.html?next='+encodeURIComponent('/admin-product-review.html'));return}
  $('status').onchange=load;$('refresh').onclick=load;load();
}
async function load(){
  var box=$('list');box.innerHTML='<div class="empty">Loading…</div>';say('');
  var r=await client.rpc('vtg_admin_product_queue',{p_status:$('status').value});
  if(r.error){box.innerHTML='<div class="empty">'+esc(r.error.code==='42501'?'This page is for VTG staff accounts only.':(r.error.message||'Could not load the queue.'))+'</div>';return}
  var rows=r.data||[];
  if(!rows.length){box.innerHTML='<div class="empty">Nothing here.</div>';return}
  box.innerHTML=rows.map(function(p){
    var imgs=(p.image_urls||[]).map(safeUrl).filter(Boolean).slice(0,5).map(function(u){return '<img src="'+esc(u)+'" alt="" loading="lazy">'}).join('');
    return '<article class="item" data-id="'+esc(p.id)+'"><div class="row"><div><strong>'+esc(p.name)+'</strong> <span class="tag">'+esc(p.review_status)+'</span>'+
      '<div class="muted">'+esc(p.category||'Uncategorised')+' · '+esc(p.currency||'')+' '+esc(p.unit_price==null?'price on request':p.unit_price)+' · MOQ '+esc(p.minimum_order_quantity||1)+(p.lead_time_days?' · '+esc(p.lead_time_days)+' days':'')+(p.hs_code?' · HS '+esc(p.hs_code):'')+'</div></div>'+
      '<div class="muted" style="text-align:right">'+esc(p.supplier_name||'Supplier')+'<br>'+esc(p.supplier_country||'')+' · supplier '+esc(p.supplier_verification||'not verified')+'</div></div>'+
      (p.description?'<p>'+esc(p.description)+'</p>':'')+(imgs?'<div class="imgs">'+imgs+'</div>':'')+
      (p.review_note?'<p class="muted">Last note: '+esc(p.review_note)+'</p>':'')+
      '<div class="actions"><textarea placeholder="Note for the supplier (required to reject)" aria-label="Note for the supplier"></textarea><button class="ok" data-d="approved" type="button">Approve</button><button class="no" data-d="rejected" type="button">Reject</button></div></article>';
  }).join('');
  box.querySelectorAll('button[data-d]').forEach(function(b){b.onclick=async function(){
    var card=b.closest('.item'),note=card.querySelector('textarea').value.trim(),d=b.getAttribute('data-d');
    if(d==='rejected'&&!note){say('Please give the supplier a reason when rejecting.',true);return}
    b.disabled=true;
    var r=await client.rpc('vtg_review_product',{p_product_id:card.getAttribute('data-id'),p_decision:d,p_note:note||null});
    if(r.error){say(r.error.message||'Could not save the decision.',true);b.disabled=false;return}
    say(d==='approved'?'Approved. The listing can now appear in the marketplace.':'Rejected. The supplier will see your note.');load();
  }});
}
init();
})();
</script>
</body>
</html>
