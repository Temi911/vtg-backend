<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG Inspection Control</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{font-family:Manrope,Arial,sans-serif;color:#23100e;background:#f5f8f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.top img{width:160px}.card{background:#fff;border:1px solid #dce5e8;border-radius:15px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.tag{display:inline-block;font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#edf1f2;text-transform:uppercase}.tag.paid{background:#e6f7ee}.tag.pending{background:#fff4d6}.tag.unpaid{background:#fdecec}.tag.ready{background:#e8f1ff}.btn{border:0;border-radius:8px;padding:9px 12px;background:#8f1d17;color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#edf1f2;color:#22343b}.btn:disabled{opacity:.5;cursor:not-allowed}.muted{color:#667085;font-size:12px;line-height:1.6}.item{border:1px solid #dce5e8;border-radius:11px;padding:14px;margin-top:9px}.select{padding:8px;border:1px solid #dce5e8;border-radius:8px;max-width:260px}.state{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}@media(max-width:650px){.row{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.select{max-width:100%;width:100%}}</style></head><body><main class="wrap"><div class="top"><a href="/"><img src="/assets/vtg-logo.svg" alt="VTG"></a><a href="/" class="btn alt">VTG</a></div><section class="card"><h1>Inspection Control Centre</h1><p class="muted">Manage payment-gated agent assignment, inspection progress and agent payouts.</p><div id="msg" class="muted"></div></section><section class="card"><h2>Inspection requests</h2><div id="requests">Loading…</div></section><section class="card"><h2>Agent network</h2><div id="agents">Loading…</div></section></main><script>const $=s=>document.querySelector(s),token=()=>localStorage.getItem('vtg_access_token')||'';async function api(p,o={}){o.headers=Object.assign({'Authorization':'Bearer '+token()},o.headers||{});return fetch('/api'+p,o)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function payLabel(s){s=String(s||'unpaid').toLowerCase();return s==='paid'?'Paid':s==='pending'?'Pending':'Unpaid'}function payClass(s){s=String(s||'unpaid').toLowerCase();return s==='paid'?'paid':s==='pending'?'pending':'unpaid'}async function load(){try{const[q,a]=await Promise.all([api('/inspections/admin/queue'),api('/inspections/admin/agents')]);if(!q.ok||!a.ok){$('#msg').textContent='Admin access is required.';return}const qd=await q.json(),ad=await a.json();render(qd.requests||[],ad.agents||[])}catch(e){$('#msg').textContent='Could not load the inspection control centre.'}}function render(list,agents){const approved=agents.filter(a=>a.status==='approved');$('#agents').innerHTML=agents.map(a=>'<div class="item"><b>'+esc(a.full_name)+'</b> <span class="tag">'+esc(a.status)+'</span><div class="muted">'+esc(a.city)+', '+esc(a.country)+' • '+esc(a.regions_served||'')+' • '+(a.experience_years||0)+' years</div><div class="actions">'+(a.status==='pending'?'<button class="btn" onclick="agentStatus(\''+a.id+'\',\'approved\')">Approve agent</button>':'')+(a.status==='approved'?'<button class="btn alt" onclick="agentStatus(\''+a.id+'\',\'suspended\')">Suspend</button>':'')+'</div></div>').join('')||'<p class="muted">No agents.</p>';$('#requests').innerHTML=list.map(x=>{const ps=String(x.inspection_payment_status||'unpaid').toLowerCase(),paid=ps==='paid',assigned=!!x.agent_name,payout=String(x.agent_payout_status||'').toLowerCase(),canAssign=paid&&!assigned&&['requested','pending','unpaid',''].includes(String(x.status||'').toLowerCase());return '<div class="item"><div class="row"><div><b>'+esc(x.reference)+'</b><div class="muted">'+esc(x.product_name)+' • '+esc(x.quantity)+' • '+esc(x.city)+', '+esc(x.country)+' • Buyer: '+esc(x.buyer_name)+'</div></div><span class="tag">'+esc(x.status)+'</span></div><div class="muted">Buyer fee: $'+Number(x.buyer_fee_usd).toFixed(2)+' • Agent payout: $'+Number(x.agent_payout_usd).toFixed(2)+'</div><div class="state"><span class="tag '+payClass(ps)+'">Payment: '+payLabel(ps)+'</span><span class="tag '+(assigned?'ready':'')+'">Agent: '+(assigned?esc(x.agent_name):'Unassigned')+'</span><span class="tag '+(payout==='paid'?'paid':payout?'pending':'')+'">Payout: '+(payout==='paid'?'Paid':payout?'Pending':'Not created')+'</span></div><div class="actions">'+(assigned?'<span class="muted">Assigned agent: '+esc(x.agent_name)+'</span>':'<select id="agent-'+x.id+'" class="select" '+(canAssign?'':'disabled')+'><option value="">'+(paid?'Select approved agent':'Payment required before assignment')+'</option>'+approved.map(a=>'<option value="'+a.id+'">'+esc(a.full_name)+' — '+esc(a.city)+'</option>').join('')+'</select> <button class="btn" '+(canAssign?'':'disabled')+' onclick="assign(\''+x.id+'\')">Assign agent</button>')+(x.status==='awaiting_buyer'&&payout!=='paid'&&payout?<button class="btn alt" onclick="payout(\''+x.id+'\')">Mark payout paid</button>':'')+(x.status==='awaiting_buyer'&&!payout?'<span class="muted">Payout will be created when the agent submits the report.</span>':'')+(ps==='pending'?'<span class="muted">Payment checkout started; awaiting confirmation.</span>':'')+'</div></div>'}).join('')||'<p class="muted">No requests.</p>'}window.agentStatus=async(id,status)=>{const r=await api('/agent/admin/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();if(!r.ok)alert(d.message||'Agent status update failed');load()};window.assign=async id=>{const el=$('#agent-'+id),agentId=el&&el.value;if(!agentId)return alert('Select an approved agent');const r=await api('/inspections/admin/requests/'+id+'/assign',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({agentId})});const d=await r.json();if(!r.ok)alert(d.message||'Assignment failed');load()};window.payout=async id=>{const reference=prompt('Enter payout reference (optional):')||undefined;const r=await api('/inspections/admin/payouts/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'paid',paymentReference:reference})});const d=await r.json();if(!r.ok)alert(d.message||'Payout update failed');load()};load();</script><script src="/vtg-site-navigation.js?v=20261010-auto-theme" defer></script>
</body></html>
