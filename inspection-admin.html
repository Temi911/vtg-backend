<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG Inspection Control</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{font-family:Manrope,Arial,sans-serif;color:#23100e;background:#f5f8f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.top img{width:160px}.card{background:#fff;border:1px solid #dce5e8;border-radius:15px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.tag{display:inline-block;font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#edf1f2;text-transform:uppercase}.tag.paid{background:#e6f7ee}.tag.pending{background:#fff4d6}.tag.unpaid{background:#fdecec}.tag.ready{background:#e8f1ff}.btn{border:0;border-radius:8px;padding:9px 12px;background:#8f1d17;color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#edf1f2;color:#22343b}.btn:disabled{opacity:.5;cursor:not-allowed}.muted{color:#667085;font-size:12px;line-height:1.6}.item{border:1px solid #dce5e8;border-radius:11px;padding:14px;margin-top:9px}.select{padding:8px;border:1px solid #dce5e8;border-radius:8px;max-width:260px}.state{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}@media(max-width:650px){.row{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.select{max-width:100%;width:100%}}</style><link rel="stylesheet" href="/vtg-typography.css?v=20261020-global-manrope-1" data-vtg-typography="1">
</head><body><main class="wrap"><div class="top"><a href="/"><img src="/assets/vtg-logo.svg" alt="VTG"></a><a href="/" class="btn alt">VTG</a></div><section class="card"><h1>Inspection Control Centre</h1><p class="muted">Manage payment-gated agent assignment, inspection progress and agent payouts.</p><div id="msg" class="muted"></div></section><section class="card"><h2>Inspection requests</h2><div id="requests">Loading…</div></section><section class="card"><h2>Inspection pricing rules</h2><p class="muted">Set approved fees before buyers can request inspections. No rates are prefilled.</p><form id="pricingForm" class="actions"><select class="select" id="priceCountry"><option>China</option><option>South Korea</option></select><input class="select" id="priceCategory" required placeholder="Category (e.g. electronics)"><select class="select" id="priceLevel"><option value="basic">Basic</option><option value="standard" selected>Standard</option><option value="advanced">Advanced</option></select><input class="select" id="priceMin" type="number" min="1" value="1" required placeholder="Minimum quantity"><input class="select" id="priceMax" type="number" min="1" placeholder="Maximum (optional)"><input class="select" id="priceBuyer" type="number" min="0" step="0.01" required placeholder="Buyer fee USD"><input class="select" id="pricePayout" type="number" min="0" step="0.01" required placeholder="Agent payout USD"><button class="btn" type="submit">Save pricing rule</button></form><div id="pricingRows" class="muted">Loading pricing…</div></section>
<section class="card"><h2>Agent network</h2><div id="agents">Loading…</div></section></main><script type="module">
import {vtgSupabase} from "/supabase/vtg-client.js";
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const call=async(path,method="GET",body)=>{const {data,error}=await vtgSupabase.functions.invoke("vtg-inspection-workflow/"+path,{method,body});if(error)throw error;return data||{}};
let agents=[],requests=[];
async function admin(){const {data:{session}}=await vtgSupabase.auth.getSession();if(!session){$("#msg").innerHTML='Administrator sign-in required. <a class="btn alt" href="/admin-signin.html?next=%2Finspection-admin.html">Sign in ↗</a>';return false}const {data:{user}}=await vtgSupabase.auth.getUser();const {data:p}=await vtgSupabase.from("profiles").select("role,is_active").eq("id",user.id).maybeSingle();if(p?.role!=="admin"||!p.is_active){$("#msg").textContent="Active administrator access is required.";return false}return true}
async function load(){try{if(!await admin())return;const [q,a,pr]=await Promise.all([call("admin/queue"),vtgSupabase.from("vtg_workforce_members").select("user_id").eq("workspace_role","agent").eq("status","active"),call("pricing")]);if(a.error)throw a.error;const ids=(a.data||[]).map(x=>x.user_id);const {data:profiles,error:pe}=ids.length?await vtgSupabase.from("profiles").select("id,full_name,email").in("id",ids):{data:[],error:null};if(pe)throw pe;requests=q.requests||[];agents=ids.map(id=>{const p=(profiles||[]).find(x=>x.id===id);return{id,name:p?.full_name||p?.email||id}});render();renderPricing(pr.pricing||[])}catch(e){$("#msg").textContent=e.message||"Could not load inspection control centre."}}
function render(){const assigned=agents;$("#agents").innerHTML=assigned.map(a=>'<div class="item"><b>'+esc(a.name)+'</b><div class="muted">'+esc(a.id)+'</div><span class="tag paid">Active agent</span></div>').join("")||'<p class="muted">No active agent memberships.</p>';$("#requests").innerHTML=requests.map(x=>'<div class="item"><div class="row"><div><b>'+esc(x.reference||x.id)+'</b><div class="muted">'+esc(x.product_name)+' · '+esc(x.quantity)+' · '+esc(x.city)+', '+esc(x.country)+'</div></div><span class="tag">'+esc(x.status)+'</span></div><div class="muted">Buyer fee: $'+Number(x.buyer_fee_usd||0).toFixed(2)+' · Agent payout: $'+Number(x.agent_payout_usd||0).toFixed(2)+' · Payment: '+esc(x.payment_status||"unpaid")+'</div><div class="actions">'+(x.inspector_id?'<span class="tag ready">Assigned</span>':'<select class="select" data-agent-for="'+esc(x.id)+'" '+(x.payment_status==="paid"?"":"disabled")+'><option value="">'+(x.payment_status==="paid"?"Select active agent":"Verified payment required")+'</option>'+assigned.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name)+'</option>').join("")+'</select><button class="btn" data-assign="'+esc(x.id)+'" '+(x.payment_status==="paid"?"":"disabled")+'>Assign agent</button>')+'</div></div>').join("")||'<p class="muted">No inspection requests.</p>'}
function renderPricing(rows){$("#pricingRows").innerHTML=rows.length?rows.map(x=>'<div class="item">'+esc(x.country)+' · '+esc(x.category)+' · '+esc(x.service_level)+' · Qty '+x.min_quantity+'–'+(x.max_quantity??"∞")+' · Buyer $'+Number(x.buyer_fee_usd).toFixed(2)+' / Agent $'+Number(x.agent_payout_usd).toFixed(2)+'</div>').join(""):"No active pricing rules configured."}
$("#requests").addEventListener("click",async e=>{const b=e.target.closest("[data-assign]");if(!b)return;const id=b.dataset.assign,agentId=$('[data-agent-for="'+CSS.escape(id)+'"]')?.value;if(!agentId)return alert("Select an active agent.");b.disabled=true;try{await call("requests/"+id+"/assign","PATCH",{agentId});$("#msg").textContent="Agent assigned.";await load()}catch(err){$("#msg").textContent=err.message||"Assignment failed";b.disabled=false}});
$("#pricingForm").addEventListener("submit",async e=>{e.preventDefault();const body={country:$("#priceCountry").value,category:$("#priceCategory").value.trim(),serviceLevel:$("#priceLevel").value,minQuantity:Number($("#priceMin").value),maxQuantity:$("#priceMax").value?Number($("#priceMax").value):null,buyerFeeUsd:Number($("#priceBuyer").value),agentPayoutUsd:Number($("#pricePayout").value)};try{await call("admin/pricing","POST",body);e.target.reset();$("#priceMin").value=1;$("#msg").textContent="Pricing rule saved.";await load()}catch(err){alert(err.message||"Could not save pricing") }});
load();
</script><script src="/vtg-site-navigation.js?v=20261020-universal-header-1" defer></script>

<style id="vtg-inspection-admin-theme-20261016">
:root{--r:#a5232b;--bg:#f4f6f8;--card:#fff;--ink:#20252d;--muted:#687586;--line:#e1e6ed;--soft:#fff0ef}
html[data-theme="dark"]{--r:#ff8e86;--bg:#0b1016;--card:#141b23;--ink:#f3f5f7;--muted:#b4c0cb;--line:#2b3743;--soft:#2b191c}
:root{font-family:Manrope,Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink)}
html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] .card,html[data-theme="dark"] .item{background:var(--card);border-color:var(--line);color:var(--ink)}
html[data-theme="dark"] .muted{color:var(--muted)}
html[data-theme="dark"] .select{background:#0e151d;color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .btn.alt{background:#202c38;color:var(--ink);border:1px solid var(--line)}
html[data-theme="dark"] .tag{background:#202c38;color:var(--ink)}
html[data-theme="dark"] .tag.paid,html[data-theme="dark"] .tag.ready{background:#10291f;color:#79d7ac}
html[data-theme="dark"] .tag.pending{background:#302716;color:#f2c66d}
html[data-theme="dark"] .tag.unpaid{background:#351d20;color:#ff9b95}
.card{background:var(--card);border-color:var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(22,31,43,.055)}
.item{background:var(--card);border-color:var(--line);border-radius:12px}
.btn{background:#a5232b;border-radius:10px;min-height:39px}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.select{background:var(--card);color:var(--ink);border-color:var(--line);font:inherit;padding:10px;border-radius:9px}
.btn:focus-visible,.select:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--r) 35%,transparent);outline-offset:2px}
</style>
</body></html>
