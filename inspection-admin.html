<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTG Inspection Control</title><style>body{margin:0;font-family:Arial;background:#f5f8f9;color:#23100e}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top img{width:160px}.card{background:#fff;border:1px solid #dce5e8;border-radius:15px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.tag{font-size:10px;padding:5px 8px;border-radius:99px;background:#edf8f8}.btn{border:0;border-radius:8px;padding:9px 12px;background:#8f1d17;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#edf1f2;color:#22343b}.muted{color:#667085;font-size:12px;line-height:1.6}.item{border:1px solid #dce5e8;border-radius:11px;padding:13px;margin-top:9px}.select{padding:8px;border:1px solid #dce5e8;border-radius:8px}@media(max-width:650px){.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><a href="/"><img src="/assets/vtg-logo.svg" alt="VTG"></a><a href="/" class="btn alt">VTG</a></div><section class="card"><h1>Inspection Control Centre</h1><p class="muted">Admin workflow for assigning verified agents, monitoring inspections and recording agent payouts.</p><div id="msg" class="muted"></div></section><section class="card"><h2>Inspection requests</h2><div id="requests">Loading…</div></section><section class="card"><h2>Agent network</h2><div id="agents">Loading…</div></section></main><script>const $=s=>document.querySelector(s),token=()=>localStorage.getItem('vtg_access_token')||'';async function api(p,o={}){o.headers=Object.assign({'Authorization':'Bearer '+token()},o.headers||{});return fetch('/api'+p,o)}async function load(){const [q,a]=await Promise.all([api('/inspections/admin/queue'),api('/inspections/admin/agents')]);if(!q.ok||!a.ok)return $('#msg').textContent='Admin access is required.';const qd=await q.json(),ad=await a.json();render(qd.requests||[],ad.agents||[])}function render(list,agents){$('#agents').innerHTML=agents.map(a=>'<div class="item"><b>'+a.full_name+'</b> <span class="tag">'+a.status+'</span><div class="muted">'+a.city+', '+a.country+' • '+(a.regions_served||'')+' • '+(a.experience_years||0)+' years</div></div>').join('')||'<p class="muted">No agents.</p>';const approved=agents.filter(a=>a.status==='approved');$('#requests').innerHTML=list.map(x=>'<div class="item"><div class="row"><div><b>'+x.reference+'</b><div class="muted">'+x.product_name+' • '+x.quantity+' • '+x.city+', '+x.country+' • Buyer: '+x.buyer_name+'</div></div><span class="tag">'+x.status+'</span></div><div class="muted">Buyer fee: $'+Number(x.buyer_fee_usd).toFixed(2)+' • Agent payout: $'+Number(x.agent_payout_usd).toFixed(2)+(x.agent_name?' • Agent: '+x.agent_name:'')+'</div><div style="margin-top:9px"><select id="agent-'+x.id+'" class="select"><option value="">Select approved agent</option>'+approved.map(a=>'<option value="'+a.id+'">'+a.full_name+' — '+a.city+'</option>').join('')+'</select> <button class="btn" onclick="assign(\''+x.id+'\')">Assign</button> '+(x.status==='awaiting_buyer'?'<button class="btn alt" onclick="payout(\''+x.id+'\')">Mark payout paid</button>':'')+'</div></div>').join('')||'<p class="muted">No requests.</p>'}window.assign=async id=>{const agentId=$('#agent-'+id).value;if(!agentId)return alert('Select an agent');const r=await api('/inspections/admin/requests/'+id+'/assign',{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},body:JSON.stringify({agentId})});const d=await r.json();if(!r.ok)alert(d.message||'Assignment failed');load()};window.payout=async id=>{const r=await api('/inspections/admin/payouts/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},body:JSON.stringify({status:'paid'})});const d=await r.json();if(!r.ok)alert(d.message||'Payout update failed');load()};load();</script></body></html>
