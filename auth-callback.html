<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17191b"><title>Confirming your VTG account</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#17191b;color:#f3efe6;font:15px Manrope,Arial,sans-serif}
.panel{width:min(480px,100%);padding:38px;border:1px solid #514b43;border-radius:18px;background:#202326;text-align:center}
.mark{font-size:12px;letter-spacing:.2em;color:#b49a70}.title{font-size:25px;margin:18px 0 10px}.copy{color:#c9c4ba;line-height:1.7}.error{color:#f1a29a}.link{display:inline-block;margin-top:20px;color:#e2c99e}
</style>
<script src="/vtg-supabase-auth.js?v=20261105-agreement-2"></script>
</head>
<body><main class="panel"><div class="mark">VINTAGE AFRICA TRADE</div><h1 class="title" id="title">Confirming your account</h1><p class="copy" id="copy">Please wait while we securely complete your sign-in.</p><a class="link" id="link" href="/signin.html" hidden>Return to sign in</a></main>
<script>
(async()=>{
 const title=document.getElementById('title'),copy=document.getElementById('copy'),link=document.getElementById('link');
 try{
  const auth=await window.VTG_AUTH_READY;
  const params=new URLSearchParams(location.search),code=params.get('code'),tokenHash=params.get('token_hash'),type=params.get('type')||'signup';
  if(code){const {error}=await auth.client.auth.exchangeCodeForSession(code);if(error)throw error;}
  else if(tokenHash){const {error}=await auth.client.auth.verifyOtp({token_hash:tokenHash,type});if(error)throw error;}
  const current=await auth.getCurrent();
  if(!current)throw new Error('This confirmation link is missing, expired or was opened in a different browser. Return to sign in or request a fresh email.');
  history.replaceState({},document.title,location.pathname);
  const user=current.user,pending=user.role==='buyer'&&!!user.requestedRole;
  const dest=pending?'/verification.html?role='+encodeURIComponent(user.requestedRole):({buyer:'/buyer-dashboard.html',supplier:'/supplier-dashboard.html',bank:'/bank-trade-os.html',agent:'/agent-dashboard.html',admin:'/admin-dashboard-preview.html'})[user.role]||'/';
  title.textContent='Email confirmed';copy.textContent='Your VTG account is confirmed. Opening the next step…';
  setTimeout(()=>{
   if(user.agreementRequired){location.replace('/signup-agreement.html?next='+encodeURIComponent(dest));return;}
   location.replace(dest);
  },900);
 }catch(error){title.textContent='We could not complete confirmation';copy.className='copy error';copy.textContent=error.message||'Please try signing in again.';link.hidden=false;}
})();
</script></body></html>
