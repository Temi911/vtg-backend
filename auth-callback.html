<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17191b"><title>Confirming your VTG account</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17191b;color:#f3efe6;font:15px Manrope,Arial,sans-serif;padding:24px}.panel{width:min(480px,100%);padding:38px;border:1px solid #514b43;border-radius:18px;background:#202326;text-align:center}.mark{font-size:12px;letter-spacing:.2em;color:#b49a70}.title{font-size:25px;margin:18px 0 10px}.copy{color:#c9c4ba;line-height:1.7}.error{color:#f1a29a}.link{display:inline-block;margin-top:20px;color:#e2c99e}
</style><script src="/vtg-supabase-auth.js?v=20261105-auth-1"></script></head><body><main class="panel"><div class="mark">VINTAGE AFRICA TRADE</div><h1 class="title" id="title">Confirming your account</h1><p class="copy" id="copy">Please wait while we securely complete your sign-in.</p><a class="link" id="link" href="/signin.html" hidden>Return to sign in</a></main>
<script>
(async()=>{
 const title=document.getElementById('title'),copy=document.getElementById('copy'),link=document.getElementById('link');
 try{
  const auth=await window.VTG_AUTH_READY;
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  const tokenHash=params.get('token_hash');
  const type=params.get('type')||'signup';

  // Supabase is configured for PKCE. The callback must exchange the returned
  // authorization code before getSession() can see the newly confirmed session.
  if(code){
   const {error}=await auth.client.auth.exchangeCodeForSession(code);
   if(error)throw error;
  }else if(tokenHash){
   const {error}=await auth.client.auth.verifyOtp({token_hash:tokenHash,type});
   if(error)throw error;
  }

  const current=await auth.getCurrent();
  if(!current){
   throw new Error(code
    ?'Your email link could not be completed in this browser. Open the link in the same browser where you started registration, or request a fresh confirmation email.'
    :'The confirmation link is missing or has expired. Please request a new confirmation email.');
  }

  // Remove one-time credentials from the address bar after successful exchange.
  history.replaceState({},document.title,location.pathname);
  const session=current.session,user=current.user,requested=session.user.user_metadata?.requested_role;
  if(!user.isActive)throw new Error('Your account is inactive. Please contact VTG support.');
  const pendingApplication=requested&&requested!=='buyer'&&user.role==='buyer';
  const needsBusinessVerification=['supplier','bank','agent'].includes(user.role)&&user.businessVerificationStatus!=='verified';
  title.textContent='Email confirmed';
  if(pendingApplication){
   copy.textContent='Your email is confirmed. Your business account application is awaiting VTG administrator review.';
   setTimeout(()=>location.replace('/verification.html'),1500);
  }else if(needsBusinessVerification){
   copy.textContent='Your account is active. Complete VTG business verification before entering your workspace.';
   setTimeout(()=>location.replace('/verification.html'),1500);
  }else{
   copy.textContent='Your VTG account is ready. Opening your workspace…';
   const dest=({buyer:'/buyer-dashboard.html',supplier:'/supplier-dashboard.html',bank:'/bank-trade-os.html',agent:'/agent-dashboard.html',admin:'/admin-dashboard-preview.html'})[user.role]||'/';
   setTimeout(()=>location.replace(dest),1200);
  }
 }catch(e){
  title.textContent='We could not complete confirmation';
  copy.className='copy error';
  copy.textContent=e.message||'Please try signing in again.';
  link.hidden=false;
 }
})();
</script></body></html>
