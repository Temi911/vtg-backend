<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a VTG Agent</title><style>:root{--r:#8f1d17;--bg:#f6f8f9;--ink:#25100e;--muted:#667085;--line:#dce5e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.wrap{max-width:980px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between}.top img{width:165px}.hero{background:linear-gradient(135deg,#3a0f0d,#8f1d17);color:white;border-radius:20px;padding:30px;margin:25px 0}.hero h1{font-size:38px;margin:8px 0}.hero p{max-width:720px;line-height:1.7;color:#eadedd}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:100px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{border:0;border-radius:9px;padding:12px 15px;background:var(--r);color:#fff;font-weight:800;cursor:pointer}.muted{color:var(--muted);font-size:12px;line-height:1.6}.msg{margin-top:10px;font-size:12px}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}.hero h1{font-size:30px}}</style></head><body><main class="wrap"><div class="top"><a href="/"><img src="/assets/vtg-logo.svg" alt="VTG"></a><a href="/" class="btn">Back</a></div><section class="hero"><small>VTG AGENT NETWORK</small><h1>Become a VTG Agent</h1><p>Help African buyers verify goods in China and South Korea before shipment. Buyers pay VTG; VTG handles agent payment.</p></section><section class="card"><h2>Agent application</h2><p class="muted">Applications are reviewed before assignments are available.</p><form id="form"><div class="grid"><div class="field"><label>Full name *</label><input name="fullName" required></div><div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Password *</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Email verification code *</label><input name="verificationCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" required><button type="button" class="btn" id="sendCode" style="margin-top:6px">Send code</button><div id="codeMsg" class="muted"></div></div><div class="field"><label>Phone *</label><input name="phone" required></div><div class="field"><label>Country *</label><select name="country"><option>China</option><option>South Korea</option></select></div><div class="field"><label>City *</label><input name="city" placeholder="Guangzhou / Seoul" required></div><div class="field"><label>Relevant experience (years) *</label><input name="experienceYears" type="number" min="0" max="60" value="1" required></div><div class="field"><label>Preferred payout method</label><select name="payoutMethod"><option>Bank transfer</option><option>Approved digital payout</option><option>Other</option></select></div></div><div class="field" style="margin-top:13px"><label>Areas/regions served *</label><input name="regionsServed" placeholder="Guangzhou, Foshan, Shenzhen" required></div><div class="field" style="margin-top:13px"><label>Languages</label><input name="languages" placeholder="English, Mandarin, Korean"></div><div class="field" style="margin-top:13px"><label>Product categories</label><div class="checks"><label><input type="checkbox" name="cat" value="clothing"> Clothing</label><label><input type="checkbox" name="cat" value="electronics"> Electronics</label><label><input type="checkbox" name="cat" value="machinery"> Machinery</label><label><input type="checkbox" name="cat" value="furniture"> Furniture</label><label><input type="checkbox" name="cat" value="beauty"> Beauty</label><label><input type="checkbox" name="cat" value="general-merchandise"> General merchandise</label></div></div><div class="field" style="margin-top:13px"><label>Experience summary</label><textarea name="bio" maxlength="2000"></textarea></div><p><label><input type="checkbox" required> I agree to the VTG Agent Code of Conduct and will submit honest, evidence-based reports.</label></p><button class="btn">Submit application</button><div id="msg" class="msg"></div></form></section></main><script>const $=s=>document.querySelector(s);$('#sendCode').onclick=async()=>{const email=$('input[name="email"]').value.trim();if(!email)return $('#codeMsg').textContent='Enter your email first.';const r=await fetch('/api/auth/send-verification-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();$('#codeMsg').textContent=r.ok?'Code sent. Check your email.':(d.message||'Could not send code.');};$('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),categories=[...document.querySelectorAll('input[name="cat"]:checked')].map(x=>x.value),languages=(f.get('languages')||'').split(',').map(x=>x.trim()).filter(Boolean);const body={email:f.get('email'),password:f.get('password'),verificationCode:f.get('verificationCode'),fullName:f.get('fullName'),phone:f.get('phone'),country:f.get('country'),city:f.get('city'),experienceYears:Number(f.get('experienceYears')),regionsServed:f.get('regionsServed'),languages,categories,bio:f.get('bio'),payoutMethod:f.get('payoutMethod')};const r=await fetch('/api/auth/signup/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){$('#msg').textContent=d.message||'Application failed.';return}localStorage.setItem('vtg_access_token',d.accessToken);if(d.refreshToken)localStorage.setItem('vtg_refresh_token',d.refreshToken);$('#msg').textContent='Application submitted. Complete your verification documents next.';setTimeout(()=>location.href='/verification.html',700)};</script></body></html>
